.card-links { text-align: center; margin-top: 6px; }
.card-links .link { font-size: 13px; }

/* Waste, on the freezer door */
.mrow { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: baseline; padding: 4px 0; border-bottom: 1px dotted #DDD6CC; font-size: 13.5px; text-align: left; }
.mrow b { font: 400 18px/1 var(--display); color: var(--title); text-align: right; }
.mrow.bar i { grid-column: 1 / -1; height: 7px; width: var(--w); background: var(--c); border-radius: 4px; }
.rest-mag { width: 100%; align-items: stretch !important; background: #FFFEFA !important; font-family: var(--text) !important; font-size: 14px !important; }
.rest-mag .cap { text-align: center; margin-bottom: 4px; }
.rest-mag small, .advice-mag small { font-size: 11.5px; line-height: 1.3; margin-top: 6px; color: var(--muted); }
.advice-mag { background: #3F3C38 !important; color: #FFFEFA; }
.advice-mag b { font: 400 18px/1.15 var(--chunky); text-transform: uppercase; margin-top: 4px; }
.advice-mag small { color: #E9E4DC; }
.sticker-sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px 8px; }
.stk { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; }
.stk b { font-size: 12.5px; line-height: 1.1; margin-top: 2px; }
.stk small { font-size: 11px; line-height: 1.25; color: var(--muted); }
.stk.on svg { filter: drop-shadow(0 4px 6px rgba(120, 100, 85, .12)); transform: rotate(-4deg); }
.stk:nth-child(even).on svg { transform: rotate(5deg); }
.door-fine { margin-top: 14px; font-size: 12px; color: var(--muted); text-align: center; }

/* FRESHLY FROZEN: drawers along the bottom of the freezer */
.drawers { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; }
.drawers .crisper { margin-top: 0; }
.fresh-window { gap: 2px; padding: 2px 6px; }
.fresh-window .fz { display: block; height: 100%; aspect-ratio: 260 / 350; }
.fresh-window em { font-size: 12px; color: var(--muted); }
.kept-drawer { background: #EFE7DA; }
.drawer-sheet { max-height: 86vh; overflow-y: auto; }
.fz-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.fz-item { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 6px 10px; border: 0; border-radius: 16px; background: #FFFEFA; color: var(--ink); }
.fz-art { display: block; width: 56px; height: 72px; }
.fz-date { font-size: 11.5px; color: var(--muted); }
.fz-name { font-size: 13px; line-height: 1.08; text-align: center; }
.fz-stamp { font-size: 10.5px; color: #D4677F; }

/* A record in the melting view: it melts into the machine's log */
.rec-chip { display: inline-block; margin-top: 6px; background: #E9EAE6; }
.bm-log { margin-top: .6em; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: .82em; line-height: 1.45; }
.bm-log p + p { margin-top: 0 !important; }
.bm-log span { opacity: .65; }
.bm-log-h { font-weight: 700; letter-spacing: .06em; opacity: .7; }
.bm-log-h::before { content: '··· '; } .bm-log-h::after { content: ' ···'; }
.is-record .bm-stamp { font-size: 13px; }
.rec-after { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-bottom: 14px; }
.rec-after .btn { max-width: 340px; }

/* Keep this memory */
.keep-sheet textarea { width: 100%; padding: 12px 13px; background: #FFFBF2; border: 0; border-radius: 13px; font: 500 15px/1.45 var(--text); color: var(--ink); resize: vertical; }
.keep-sheet .field input { background: #FFFBF2; }
.keep-where { border: 0; padding: 0; margin: 0 0 12px; font-size: 14px; }
.keep-where legend { font-size: 15px; margin-bottom: 6px; }
.keep-where label { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
.keep-where input { width: 18px; height: 18px; accent-color: #E58FA2; }

@media (prefers-reduced-motion: reduce) {
  .ghost-ic .mx-float, .sticker-pop, .fate.go svg, .filed.go .filed-ic { animation: none !important; }
}
.rest-picks .pick { background: #FFFEFA; } .rest-picks .pick.on { background: var(--strawberry); }
.fresh-drawer .crisper-window, .kept-drawer .crisper-window { height: 46px; }

/* ---- FINAL VERDICT, second edition: a game ending, not a report ---- */
.verdict.v2 .vtop { width: 100%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.verdict.v2 .vtop .link { justify-self: start; font-size: 13px; }
.verdict.v2 .vtop .kicker { margin: 6px 0; }
.verdict.v2 .chr { height: min(30vh, 250px); margin-top: 6px; }
.verdict.v2 .chr.drop-dead > svg { transform-origin: 50% 92%; animation: keelOver 1.1s cubic-bezier(.4, 0, .3, 1) .45s both; }
@keyframes keelOver { 0% { transform: rotate(0) } 45% { transform: rotate(-11deg) } 70% { transform: rotate(-5deg) } 100% { transform: rotate(-7deg) } }
.vstamp { font-size: 13px; }
.vstamp.stamp-in { animation: stampIn .5s cubic-bezier(.3, 1.5, .5, 1) .9s both; }
@keyframes stampIn { 0% { transform: rotate(12deg) scale(2.4); opacity: 0 } 100% { transform: rotate(12deg) scale(1); opacity: 1 } }
.scoreboard.big { max-width: 380px; margin: 12px auto 0; }
.scoreboard.big > div { font-size: 13px; padding: 10px 4px 8px; }
.scoreboard.big b { font-size: clamp(52px, 15vw, 68px); }
.scoreboard.big.hit > div + div b { color: #6E9A45; }
.mquote.one { font-size: clamp(18px, 5vw, 21px); max-width: 21em; margin: 14px auto 0; line-height: 1.2; }
.vtags { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 12px; }
.vtag { font-size: 13px; padding: 5px 13px 6px; border-radius: 999px; }
.unlocked.ach-row { background: none; padding: 0; margin-top: 12px; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px; }
.unlocked.ach-row .sticker-pop { width: auto; max-width: 150px; }
.unlocked.ach-row .sticker-pop b { font-size: 12px; }
.verdict.v2 .verdict-foot { margin-top: 20px; align-items: center; }
.verdict.v2 .verdict-foot > .btn { width: 100%; }
.vlinks { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 10px; margin-top: 4px; color: var(--muted); }
.vlinks .link { font: 400 13.5px var(--chunky); letter-spacing: .02em; padding: 6px 2px; }
.btn.into-freezer { display: flex; align-items: center; justify-content: center; gap: 10px; }
.btn.into-freezer .filed.filed-small { margin-top: -6px; }
.filed.filed-small { display: inline-block; position: relative; width: 26px; height: 30px; margin: 0; padding: 0; background: none; overflow: visible; border-radius: 0; flex: none; }
.filed.filed-small .filed-ic { position: absolute; left: 3px; bottom: 4px; width: 20px; height: 26px; margin: 0; opacity: 0; }

// Demo "I resisted" entries: [date, place id or '']
const DEMO_RESISTED = [['2026-09-21', 'cinema'], ['2026-10-15', '']];
function buildDemoRecords() {
  const resisted = DEMO_RESISTED.map(([date, loc], i) => ({ id: 'demo-r' + (i + 1), isDemo: true, kind: 'resisted', date: date + 'T18:00:00', name: 'The one you didn’t buy', finalVerdict: 'RESISTED', ...(loc ? { loc } : {}) }));
  return [...DEMO_RECORDS.map((d, i) => {
    const [name, place, form, flavor, reason, predicted, confScore, bites, finished, first, later, stop, rebuy, date, toppings, decorations] = d;
    const pick = (id, idx) => ({ checkpoint: id, label: CHECKPOINTS[id].options[idx].label, score: CHECKPOINTS[id].options[idx].score });
    const laterReactions = later.map(([id, idx], j) => ({ bite: [3, 5, 8, 12][j], ...pick(id, idx) }));
    return finaliseRecord({
      id: 'demo-' + (i + 1), isDemo: true, date: date + 'T15:00:00', name, place, form, flavorCategory: flavor, reasonForBuying: reason, toppings, decorations,
      predictedBites: predicted, predictionConfidence: confidenceLabel(confScore), predictionConfidenceScore: confScore,
      actualBites: bites, finished,
      firstReaction: first.length ? pick(first[0][0], first[0][1]) : null,
      laterReactions, stopReason: stop, repurchase: rebuy, kind: 'bought', ...DEMO_EXTRAS[i],
    });
  }), ...resisted].sort((a, b) => a.date.localeCompare(b.date));
}

/* ==========================================================================
   LOCAL STORAGE
   Real records live in localStorage under STORAGE_KEY as one list. There are
   two kinds of entry.

   An ice cream that was bought (kind 'bought', or no kind at all on records
   saved before the kind existed):
   {
     id, date, name, place, form, flavorCategory, toppings, decorations, reasonForBuying,
     predictedBites, predictionConfidence, predictionConfidenceScore, finishOddsOneIn,
     actualBites, finished,
     firstReaction:  { checkpoint, label, score } or null,
     laterReactions: [ { bite, checkpoint, label, score }, ... ],
     stopReason, repurchase,
     finalVerdict (title), verdictId, predictionError (actual minus predicted)
     Added later, all optional. Older records simply don't have them, which
     always reads as "unknown", never as a guess:
     mode       'game' (tapped bite by bite) or 'quick' (recorded afterwards)
     challenge  'believe' or 'doubt' on older records (the bet was removed; new ones never have it)
     rest       where the rest went: 'trashed', 'shared', 'saved', 'unsaid', or missing
     whyStop    'taste', 'toomuch', 'dislike', 'complicated', or missing
     loc        an id from LOCATIONS, only ever picked by hand
     changedMind true when this purchase replaced an "I resisted"
     advice     the key of the advice the machine gave afterwards (see ADVICE)
     keep       { title, text, at }: a memory written for it and shared on purpose
   }

   An ice cream that was NOT bought (kind 'resisted'):
   { id, kind: 'resisted', date, name, finalVerdict, loc, changedMind }
   Resisted entries never count as purchases, bites, waste or prediction data.
   allRecords() leaves them out; allEntries() includes them.

   If storage is unavailable (private browsing, for example), the game still
   runs from memory and forgets everything when the tab closes.
   ========================================================================== */
const STORAGE_KEY = 'willYouFinishIt.records.v1';
const CURRENT_KEY = 'willYouFinishIt.currentGame.v1';
const memoryStore = {};

function storeGet(key) {
  try { const v = localStorage.getItem(key); return v === null ? (memoryStore[key] ?? null) : v; }
  catch (e) { return memoryStore[key] ?? null; }
}
function storeSet(key, value) {
  memoryStore[key] = value;
  try { localStorage.setItem(key, value); } catch (e) {}
}
function storeDelete(key) {
  delete memoryStore[key];
  try { localStorage.removeItem(key); } catch (e) {}
}

function loadRealRecords() {
  try { const list = JSON.parse(storeGet(STORAGE_KEY)); return Array.isArray(list) ? list.map(plainName) : []; }
  catch (e) { return []; }
}
// An ice cream nobody named is just called what it is ("Mango cone").
// Older records saved as "Unnamed mango cone" lose the "Unnamed".
const defaultName = (flavor, form) => {
  const f = (FLAVORS[flavor] || FLAVORS.other).short;
  return f.charAt(0).toUpperCase() + f.slice(1) + ' ' + (form === 'other' ? 'ice cream' : (FORMS[form] || FORMS.other).label.toLowerCase());
};
function plainName(r) {
  if (!r || typeof r.name !== 'string' || !/^Unnamed /.test(r.name)) return r;
  const n = r.name.slice(8).replace(/ other$/, ' ice cream');
  return { ...r, name: n.charAt(0).toUpperCase() + n.slice(1) };
}
function saveRealRecords(list) { storeSet(STORAGE_KEY, JSON.stringify(list)); }

// Every record the game can see, oldest first. Demo records are added only here,
// at read time, so they can never leak into saved data.
let demoCache = null;
function allEntries() {
  if (!USE_DEMO_DATA) return loadRealRecords();
  if (!demoCache) demoCache = buildDemoRecords();
  return [...demoCache, ...loadRealRecords()];
}
const isResisted = r => r.kind === 'resisted';
// Bought ice creams only: the only entries the machine, the stats and the galleries ever count.
function allRecords() { return allEntries().filter(r => !isResisted(r)); }
function resistedEntries() { return allEntries().filter(isResisted); }
function findRecord(id) { return allEntries().find(r => r.id === id) || null; }
const newId = () => 'ic-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6);

function saveRecord(record) {
  const list = loadRealRecords();
  list.push(record);
  saveRealRecords(list);
  queueShared({ action: 'save', record });
  // Asks the browser not to clear this site's data on its own. Allowed to fail.
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
}
// Changes a record that's already saved (same id), here and in the shared archive.
// Demo records are never saved, so changes to them are ignored.
function updateRecord(record) {
  if (record.isDemo) return;
  const list = loadRealRecords();
  const at = list.findIndex(r => r.id === record.id);
  if (at < 0) return;
  list[at] = record;
  saveRealRecords(list);
  queueShared({ action: 'save', record });
}
function deleteEntry(id) {
  saveRealRecords(loadRealRecords().filter(r => r.id !== id));
  queueShared({ action: 'delete', id });
}

/* ==========================================================================
   SHARED ARCHIVE
   When SHARED_ARCHIVE_URL is set, the browser's list above becomes a copy of
   the Google Sheet. Changes go into a "to send" list first, so nothing is lost
   without signal: they are sent as soon as the sheet can be reached.
   ========================================================================== */
const PENDING_KEY = 'willYouFinishIt.pending.v1';
let sync = { status: SHARED_ARCHIVE_URL ? 'loading' : 'off', at: null };
let flushing = null;

function loadPending() {
  try { const list = JSON.parse(storeGet(PENDING_KEY)); return Array.isArray(list) ? list : []; }
  catch (e) { return []; }
}
function savePending(list) { if (list.length) storeSet(PENDING_KEY, JSON.stringify(list)); else storeDelete(PENDING_KEY); }

async function callSheet(body) {
  // Plain text keeps the browser from asking Google for extra permission first.
  const res = await fetch(SHARED_ARCHIVE_URL, { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'text/plain;charset=utf-8' } });
  const answer = await res.json();
  if (!answer.ok) throw new Error(answer.error || 'The sheet said no');
  return answer;
}
function queueShared(change) {
  if (!SHARED_ARCHIVE_URL) return;
  savePending([...loadPending(), change]);
  sendPending();
}
// Sends waiting changes one at a time, oldest first.
function sendPending() {
  if (!SHARED_ARCHIVE_URL) return Promise.resolve();
  if (flushing) return flushing;
  const run = (async () => {
    try {
      while (loadPending().length) {
        await callSheet(loadPending()[0]);
        savePending(loadPending().slice(1));
      }
      sync = { status: 'ok', at: Date.now() };
    } catch (e) {
      sync = { status: 'offline', at: sync.at };
    }
  })();
  flushing = run.finally(() => { flushing = null; });   // cleared only after it is set, even when there was nothing to send
  return flushing;
}
// Fetches the whole archive, keeps any changes still waiting to be sent.
async function pullShared() {
  if (!SHARED_ARCHIVE_URL) return;
  await sendPending();
  try {
    const res = await fetch(SHARED_ARCHIVE_URL + (SHARED_ARCHIVE_URL.includes('?') ? '&' : '?') + 't=' + Date.now());
    const answer = await res.json();
    if (!answer.ok || !Array.isArray(answer.records)) throw new Error('Unexpected answer');
    let list = answer.records;
    for (const change of loadPending()) {
      if (change.action === 'save') list = [...list.filter(r => r.id !== change.record.id), change.record];   // the newer, unsent version wins
      if (change.action === 'delete') list = list.filter(r => r.id !== change.id);
      if (change.action === 'reset') list = [];
    }
    list.sort((a, b) => String(a.date).localeCompare(String(b.date)));
    const changed = JSON.stringify(list) !== JSON.stringify(loadRealRecords());
    saveRealRecords(list);
    seedAchievementsAfterPull();
    sync = { status: loadPending().length ? 'offline' : 'ok', at: Date.now() };
    if (changed) refreshIfBrowsing();
  } catch (e) {
    sync = { status: 'offline', at: sync.at };
  }
  if (location.hash.startsWith('#about')) refreshIfBrowsing(true);
}
// Redraws a gallery screen when new records arrive. Never interrupts a game.
function refreshIfBrowsing(force) {
  const route = location.hash.replace('#', '').split('/')[0];
  if (overlay.classList.contains('open')) return;
  if (route === 'freezer' && document.getElementById('chest')) { refreshFreezerRecords(); return; }
  if (['graveyard', 'hall', 'archive', 'about', 'freezer'].includes(route) || (force && route === 'about')) {
    const y = window.scrollY;
    render();
    window.scrollTo(0, y);
  }
}
const stillLoading = () => sync.status === 'loading' && !loadRealRecords().length;
function screenSyncing(title) {
  return `<section class="screen wide"><div class="pagehead"><h1 class="melty" style="font-size:min(calc((100vw - 40px) / 6.9), 84px)">${esc(title)}</h1></div>
    <div class="empty"><div class="mini-char shake" style="height:140px">${iceCream({ form: 'cone', flavor: 'vanilla', mood: 'nervous' })}</div>
    <p class="chunky" style="margin-top:12px;font-size:19px">Checking the freezer…</p></div></section>`;
}

/* ==========================================================================
   PREDICTION ALGORITHM
   How long will this ice cream survive? A transparent weighted average.

   1. Start with a neutral guess (baselineBites), counted as if it were
      baselineWeight ice creams. With no history, that is the whole answer.
   2. Every past ice cream votes with its actual bite count. Its vote is heavier
      the more similar it is: any ice cream < same form < same flavor < both.
      Shared toppings add a little more. Decorations are recorded but ignored.
      The more history there is, the less the neutral guess matters.
   3. Nudge the result using how often similar ice creams were finished and
      how much the player wanted to buy them again.
   4. Confidence grows with the amount of similar evidence, is capped below
      certainty, and drops when similar ice creams behaved inconsistently.

   Returns the prediction, plus "working" (shown on the machine's receipt)
   so the logic can be seen and explained.
   ========================================================================== */
function predictSurvival(form, flavor, records, toppings = []) {
  const P = PREDICTION;
  const past = records.filter(r => !(r.finished && r.actualBites <= 1)); // unlogged finishes teach nothing

  const sameForm   = past.filter(r => r.form === form);
  const sameFlavor = past.filter(r => r.flavorCategory === flavor);
  const exact      = past.filter(r => r.form === form && r.flavorCategory === flavor);
  const similar    = past.filter(r => r.form === form || r.flavorCategory === flavor);
  const sharedToppings = r => (r.toppings || []).filter(t => toppings.includes(t)).length;
  const sameTopping = past.filter(r => sharedToppings(r) > 0);

  // Step 1 + 2: weighted average of bites
  let totalBites  = P.baselineBites * P.baselineWeight;
  let totalWeight = P.baselineWeight;
  for (const r of past) {
    let w = P.weightAny;
    if (r.form === form) w += P.weightSameForm;
    if (r.flavorCategory === flavor) w += P.weightSameFlavor;
    if (r.form === form && r.flavorCategory === flavor) w += P.weightExact;
    w += sharedToppings(r) * P.weightSharedTopping;
    totalBites  += r.actualBites * w;
    totalWeight += w;
  }
  const weightedAverage = totalBites / totalWeight;

  // Step 3: nudges from similar ice creams
  let finishNudge = 0, rebuyNudge = 0;
  if (similar.length >= P.minSimilarForNudge) {
    const finishRate = similar.filter(r => r.finished).length / similar.length;
    finishNudge = (finishRate - P.usualFinishRate) * P.finishNudgeBites;
    const answered = similar.filter(r => r.repurchase);
    if (answered.length) {
      const rebuyScore = answered.reduce((s, r) => s + ({ yes: 1, maybe: .5, no: 0 }[r.repurchase] ?? .5), 0) / answered.length;
      rebuyNudge = (rebuyScore - .5) * P.rebuyNudgeBites;
    }
  }
  const predictedBites = Math.max(1, Math.round(weightedAverage + finishNudge + rebuyNudge));

  // Step 4: confidence
  const evidence = past.length * .15 + sameForm.length * P.weightSameForm + sameFlavor.length * P.weightSameFlavor + exact.length * P.weightExact + sameTopping.length * P.weightSharedTopping;
  let score = P.maxConfidence * (1 - Math.exp(-evidence / P.evidenceSpeed));
  const spread = similar.length >= 2 ? stdDev(similar.map(r => r.actualBites)) / Math.max(1, mean(similar.map(r => r.actualBites))) : 0;
  const contradictory = similar.length >= 3 && spread >= P.contradictionSpread;
  if (contradictory) score *= P.contradictionPenalty;
  score = Math.round(score);

  // A funny-but-honest message about the state of the evidence
  let message;
  if (past.length === 0) message = COPY.predictionNoHistory;
  else if (contradictory) message = COPY.predictionContradiction;
  else if (exact.length >= 2) message = COPY.predictionKnows;
  else if (similar.length === 0) message = COPY.predictionOdd;
  else message = score < 28 ? COPY.predictionNoHistory : score < 48 ? COPY.predictionFewRecords : COPY.predictionKnows;

  // Odds of finishing, smoothed so one lucky ice cream can't promise anything
  const similarFinished = similar.filter(r => r.finished).length;
  const finishChance = (similarFinished + .5) / (similar.length + 3);

  return {
    predictedBites,
    confidenceScore: score,
    confidence: confidenceLabel(score),
    message,
    finishOddsOneIn: Math.max(2, Math.round(1 / finishChance)),
    working: {
      start: P.baselineBites,
      all:    { n: past.length,       avg: mean(past.map(r => r.actualBites)) },
      form:   { n: sameForm.length,   avg: mean(sameForm.map(r => r.actualBites)) },
      flavor: { n: sameFlavor.length, avg: mean(sameFlavor.map(r => r.actualBites)) },
      exact:  { n: exact.length,      avg: mean(exact.map(r => r.actualBites)) },
      topping:{ n: sameTopping.length, avg: mean(sameTopping.map(r => r.actualBites)) },
      finishNudge, rebuyNudge, weightedAverage,
    },
    flavorRecord: {
      won:  sameFlavor.filter(r => r.finished).length,
      lost: sameFlavor.filter(r => !r.finished).length,
    },
  };
}

function confidenceLabel(score) {
  return (CONFIDENCE_LABELS.find(c => score < c.below) || CONFIDENCE_LABELS[CONFIDENCE_LABELS.length - 1]).label;
}
function mean(nums) { return nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : 0; }
function stdDev(nums) { const m = mean(nums); return Math.sqrt(mean(nums.map(n => (n - m) ** 2))); }

/* ==========================================================================
   VERDICT RULES
   Gathers the facts about a finished game and walks down the VERDICTS list
   (in EDITABLE SETTINGS) until a rule matches. No randomness: the same game
   always gets the same verdict.
   ========================================================================== */
function verdictFacts(r) {
  const scores = [r.firstReaction, ...(r.laterReactions || [])].filter(Boolean).map(x => x.score);
  return {
    bites: r.actualBites,
    finished: r.finished,
    first: r.firstReaction ? r.firstReaction.score : null,
    last: scores.length ? scores[scores.length - 1] : null,
    average: scores.length ? mean(scores) : null,
    lowest: scores.length ? Math.min(...scores) : null,
    answers: scores.length,
    rebuy: r.repurchase,
    stop: r.stopReason,
    impulse: !!(REASONS[r.reasonForBuying] && REASONS[r.reasonForBuying].impulse),
    beatBy: r.actualBites - r.predictedBites,
    why: whyOf(r),
    rest: r.rest || null,
    challenge: r.challenge || null,
    odds: r.finishOddsOneIn || null,
  };
}
// A verdict's line, filled in with this record's numbers when it has any.
function verdictCopy(v, r) { return typeof v.copy === 'function' ? v.copy(verdictFacts(r)) : v.copy; }
function decideVerdict(r) {
  const g = verdictFacts(r);
  return VERDICTS.find(v => v.when(g));
}
function verdictOf(r) {
  return VERDICTS.find(v => v.id === r.verdictId) || decideVerdict(r);
}
// Fills in the fields worked out from the others, for real and demo records alike.
function finaliseRecord(r) {
  const v = decideVerdict(r);
  r.verdictId = v.id;
  r.finalVerdict = v.title;
  r.predictionError = r.actualBites - r.predictedBites;
  return r;
}
function isConfidentlyWrong(r) {
  return r.predictionConfidenceScore >= V.confidentlyWrongScore && Math.abs(r.predictionError) >= V.confidentlyWrongBites;
}
function inHallOfFame(r) {
  return r.finished || (r.predictionError >= V.hallOfFameBeatBy && r.actualBites >= V.hallOfFameMinBites);
}
function accuracyHeadline(err) {
  if (err === 0) return COPY.accuracy.exact;
  if (err >= 3) return COPY.accuracy.under;
  if (err <= -3) return COPY.accuracy.over;
  return COPY.accuracy.wrongBy(Math.abs(err));
}
function epitaph(r) {
  const e = r.predictionError;
  if (e === 0) return COPY.epitaph.exact;
  if (e <= -3) return COPY.epitaph.over;
  if (e < 0) return COPY.epitaph.slightOver;
  if (e < 3) return COPY.epitaph.slightUnder;
  return COPY.epitaph.under;
}
// One line under the result. Compares this game with the player's own history.
function afterline(r, others) {
  if (r.predictionError === 0) return COPY.afterlines.exact;
  if (isConfidentlyWrong(r)) return COPY.afterlines.confident;
  const same = others.filter(o => o.flavorCategory === r.flavorCategory);
  if (same.length >= 2) {
    const nums = same.map(o => o.actualBites);
    if (Math.max(...nums) - Math.min(...nums) >= 5) return COPY.afterlines.multitudes;
    if (Math.abs(r.actualBites - mean(nums)) >= 3) return COPY.afterlines.outOfCharacter;
  }
  return Math.abs(r.predictionError) >= 3 ? COPY.afterlines.bigMiss : COPY.afterlines.fallback;
}

/* ==========================================================================
   STATS: everything on the freezer door
   ========================================================================== */
function tally(list) {
  const counts = {};
  list.filter(Boolean).forEach(x => counts[x] = (counts[x] || 0) + 1);
  return Object.entries(counts).sort((a, b) => b[1] - a[1]);
}
function computeStats(records) {
  const total = records.length;
  const finished = records.filter(r => r.finished);
  const abandoned = records.filter(r => !r.finished);
  const errors = records.map(r => Math.abs(r.predictionError));

  const byFlavor = {};
  records.forEach(r => (byFlavor[r.flavorCategory] = byFlavor[r.flavorCategory] || []).push(r));
  const flavorRank = Object.entries(byFlavor).map(([k, rs]) => ({
    key: k, n: rs.length, avg: mean(rs.map(r => r.actualBites)),
    rate: rs.filter(r => r.finished).length / rs.length,
    min: Math.min(...rs.map(r => r.actualBites)), max: Math.max(...rs.map(r => r.actualBites)),
  })).sort((a, b) => (b.rate * 100 + b.avg) - (a.rate * 100 + a.avg));
  const confusing = flavorRank.filter(f => f.n >= 2).sort((a, b) => (b.max - b.min) - (a.max - a.min))[0];

  const byTopping = {};
  records.forEach(r => (r.toppings || []).forEach(t => (byTopping[t] = byTopping[t] || []).push(r.actualBites)));
  const luckyTopping = Object.entries(byTopping).filter(([, b]) => b.length >= 2)
    .map(([key, b]) => ({ key, avg: mean(b) })).sort((a, b) => b.avg - a.avg)[0] || null;

  const half = Math.floor(errors.length / 2);
  const recent = errors.slice(-5);
  const longest = [...records].sort((a, b) => b.actualBites - a.actualBites)[0];
  const impulse = records.filter(r => REASONS[r.reasonForBuying] && REASONS[r.reasonForBuying].impulse).length;
  const answered = records.filter(r => r.reasonForBuying).length;
  let closeStreak = 0;
  for (let i = errors.length - 1; i >= 0 && errors[i] > ACCURACY_TOLERANCE_BITES; i--) closeStreak++;

  return {
    total,
    finished: finished.length,
    finishRate: total ? finished.length / total : 0,
    avgAbandonBite: mean(abandoned.map(r => r.actualBites)),
    hasAbandoned: abandoned.length > 0,
    topCause: tally(abandoned.map(r => r.stopReason))[0],
    bestFlavor: flavorRank[0] || null,
    worstFlavor: flavorRank.length > 1 ? flavorRank[flavorRank.length - 1] : null,
    confusing: confusing && confusing.max - confusing.min >= 3 ? confusing : null,
    accuracy: total ? errors.filter(e => e <= ACCURACY_TOLERANCE_BITES).length / total : 0,
    topReason: tally(records.map(r => r.reasonForBuying))[0],
    impulseRate: answered ? impulse / answered : 0,
    avgError: mean(errors),
    recentError: mean(recent),
    errors,
    missStreak: closeStreak,
    earlyError: half >= 3 ? mean(errors.slice(0, half)) : null,
    lateError: half >= 3 ? mean(errors.slice(half)) : null,
    confidentlyWrong: records.filter(isConfidentlyWrong).length,
    luckyTopping,
    longest,
  };
}

    case 'Thai tea':  return `<path d="M${cx - rx * .8} ${cy - ry * .45} q${rx * .4} ${ry * .5} ${rx * .8} 0 t${rx * .8} ${ry * .15} M${cx - rx * .75} ${cy + ry * .5} q${rx * .4} ${ry * .4} ${rx * .75} 0 t${rx * .75} 0" stroke="${f.speck}" stroke-width="7" fill="none" stroke-linecap="round"/>`;
    // Oreo crumbs only on the top of the scoop, away from the face
    case 'Oreo':      return (oreoSpots || spots).map((s, i) => place(s, (x, y) => `<path d="M${x - 7} ${y - 1} l5 -5 l8 2 l1 6 l-8 4Z" ${oreoSpots ? `transform="rotate(${i * 47} ${x} ${y})"` : ''} fill="${f.speck}"/>`)).join('');
    case 'chocolate': return spots.map(s => place(s, (x, y) => `<rect x="${x - 5}" y="${y - 3}" width="11" height="6" rx="2" transform="rotate(${x % 70} ${x} ${y})" fill="${f.speck}"/>`)).join('');
    case 'vanilla':   return spots.map(s => place(s, (x, y) => `<circle cx="${x}" cy="${y}" r="2.6" fill="${f.speck}"/>`)).join('');
    case 'fruit':     return spots.map(s => place(s, (x, y) => `<path d="M${x} ${y - 5} q5 6 0 10 q-5 -4 0 -10" fill="${f.speck}"/>`)).join('');
    case 'nutty':     return spots.map(s => place(s, (x, y) => `<path d="M${x - 7} ${y} l5 -6 l8 2 l1 7 l-9 3Z" fill="${f.speck}"/>`)).join('');
    case 'coffee':    return spots.slice(0, 6).map(s => place(s, (x, y) => `<g transform="rotate(${x % 60} ${x} ${y})"><ellipse cx="${x}" cy="${y}" rx="8" ry="5.5" fill="${f.speck}"/><path d="M${x - 7} ${y} q7 -3 14 0" stroke="${f.base}" stroke-width="1.6" fill="none"/></g>`)).join('');
    case 'tea':       return spots.slice(0, 6).map(s => place(s, (x, y) => `<path d="M${x - 9} ${y + 3} q8 -13 18 -6 q-8 12 -18 6Z" fill="${f.speck}"/>`)).join('');
    case 'caramel':   return `<path d="M${cx - rx * .8} ${cy - ry * .6} q${rx * .4} ${ry * .5} ${rx * .8} 0 t${rx * .8} ${ry * .2} M${cx - rx * .7} ${cy + ry * .55} q${rx * .4} ${ry * .4} ${rx * .7} 0 t${rx * .7} 0" stroke="${f.speck}" stroke-width="6" fill="none" stroke-linecap="round"/>`;

    default:          return spots.slice(0, 4).map(s => place(s, (x, y) => `<text x="${x}" y="${y}" font-family="var(--chunky)" font-size="20" fill="${f.speck}" text-anchor="middle">?</text>`)).join('');
  }
}

// Repeatable pseudo-random numbers, so a topping lands in the same place every time.
function seeded(text) {
  let h = 2166136261;
  for (const c of text) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return (h >>> 0) / 4294967296; };
}
function scatter(key, [cx, cy, rx, ry], count, avoid) {
  const rnd = seeded(key), pts = [];
  for (let tries = 0; pts.length < count && tries < count * 15; tries++) {
    const a = rnd() * Math.PI * 2, r = Math.sqrt(rnd());
    const x = cx + Math.cos(a) * r * rx, y = cy + Math.sin(a) * r * ry;
    if (avoid && ((x - avoid[0]) / (44 * avoid[2])) ** 2 + ((y - avoid[1]) / (30 * avoid[2])) ** 2 < 1) continue;
    if (pts.some(p => Math.hypot(p[0] - x, p[1] - y) < 13)) continue;
    pts.push([x, y, rnd()]);
  }
  return pts;
}
// TOPPING DRAWINGS: each one scatters small shapes over "area".
function toppingSVG(key, f, area, avoid, size = 1) {
  const pts = n => scatter(key + f.short, area, n, avoid);
  const rot = (p, d) => `transform="rotate(${Math.round(p[2] * 360)} ${p[0].toFixed(1)} ${p[1].toFixed(1)}) translate(${p[0].toFixed(1)} ${p[1].toFixed(1)}) scale(${size})"`;
  const brown = f.short === 'chocolate' || f.short === 'coffee';
  switch (key) {
    case 'sprinkles': return pts(16).map((p, i) => `<g ${rot(p)}><rect x="-7" y="-2.6" width="14" height="5.2" rx="2.6" fill="${['#EE6B83', '#FFE98F', '#C3C5F8', '#FFFDF5', '#CFE8B0', '#FFB3C8'][i % 6]}"/></g>`).join('');
    case 'chips':     return pts(10).map(p => `<g ${rot(p)}><path d="M0 -7 Q7 3 5 5 Q0 8 -5 5 Q-7 3 0 -7Z" fill="${f.short === 'chocolate' ? '#FFF2C4' : '#7F5A45'}"/></g>`).join('');
    case 'nuts':      return pts(9).map(p => `<g ${rot(p)}><path d="M-8 1 L-3 -6 L6 -5 L8 3 L0 7Z" fill="#D9A566"/></g>`).join('');
    case 'cookie':    return pts(8).map(p => `<g ${rot(p)}><path d="M-9 -2 L-2 -8 L8 -5 L7 5 L-3 8Z" fill="#C9A17E"/><circle cx="-1" cy="0" r="1.8" fill="#8F6A50"/><circle cx="4" cy="-2" r="1.1" fill="#8F6A50"/><circle cx="-4" cy="3" r="1" fill="#8F6A50"/></g>`).join('');
    case 'fruit':     return pts(9).map((p, i) => `<g ${rot(p)}><rect x="-6.5" y="-6.5" width="13" height="13" rx="3" fill="${['#EE6B83', '#F7CF8B', '#CFE8B0'][i % 3]}"/></g>`).join('');
    case 'mochi':     return pts(7).map(p => `<g ${rot(p)}><rect x="-9" y="-8" width="18" height="16" rx="7" fill="#FFFDF5"/></g>`).join('');
    case 'boba':      return pts(9).map(p => `<g transform="translate(${p[0].toFixed(1)} ${p[1].toFixed(1)}) scale(${size})"><circle r="8" fill="#D9B48F"/><circle r="4.2" fill="#C59C76"/><circle cx="-3.8" cy="-4" r="1.6" fill="#FFFDF5" opacity=".85"/></g>`).join('');
    case 'popcorn':   return pts(8).map(p => `<g ${rot(p)}><path d="M-3 -7 a4.6 4.6 0 0 1 7 2 a4.6 4.6 0 0 1 3 7 a4.6 4.6 0 0 1 -6 3 a4.6 4.6 0 0 1 -7 -2 a4.6 4.6 0 0 1 -1 -7 a4.6 4.6 0 0 1 4 -3Z" fill="#FFF6DA"/><circle cx="0.5" cy="1" r="2.1" fill="#F4C879"/></g>`).join('');
    case 'jam': {
      const [cx, cy, rx, ry] = area, y = cy - ry * .56, w = (rx * 2 + 24) / 6, x0 = cx - rx - 12, top = cy - ry * 3;
      let wave = '';
      [ry * .2, ry * .42, ry * .1, ry * .34, ry * .16, ry * .4].forEach(d => { wave += `q${w / 2} ${d * 2} ${w} 0 `; });
      const seeds = scatter('jam' + f.short, [cx, y - ry * .08, rx * .8, ry * .22], 7).map(p => `<ellipse cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" rx="1.4" ry="2.1" fill="#FFE7A8"/>`).join('');
      return `<path d="M${x0} ${top} V${y} ${wave} V${top} Z" fill="#EE7C96"/>${seeds}<path d="M${cx - rx * .62} ${y - ry * .12} q${rx * .22} ${-ry * .2} ${rx * .46} ${-ry * .14}" fill="none" stroke="#FFD6E0" stroke-width="3.4" stroke-linecap="round"/>`;
    }
    case 'sauce': {
      const [cx, cy, rx, ry] = area, y = cy - ry * .34, c = brown ? '#FFB3C8' : '#B08A70';
      const w = (rx * 2 + 24) / 6, x0 = cx - rx - 12;
      let wave = '';
      [ry * .3, ry * .08, ry * .46, ry * .12, ry * .36, ry * .05].forEach((d, i) => { wave += `q${w / 2} ${d * 2} ${w} 0 `; });
      return `<path d="M${x0} ${cy - ry * 3} V${y} ${wave} V${cy - ry * 3} Z" fill="${c}"/>`;
    }
  }
  return '';
}
// DECORATION DRAWINGS: placed at the top of the ice cream. "back" goes behind it, "front" over it.
function decorSVG(list, x, y) {
  const has = k => list.includes(k);
  const lift = has('whipped') ? 26 : 0;
  let back = '', front = '';
  if (has('wafer')) back += `<g transform="translate(${x + 26} ${y + 22}) rotate(20)"><rect x="-10" y="-82" width="20" height="96" rx="5" fill="#F3D3A4"/><path d="M-9 -66 L9 -54 M-9 -46 L9 -34 M-9 -26 L9 -14" stroke="#E3BA86" stroke-width="3.5"/></g>`;
  if (has('pocky')) back += `<g transform="translate(${x - 26} ${y + 22}) rotate(-18)"><rect x="-6" y="-90" width="12" height="106" rx="6" fill="#B08A70"/><rect x="-4" y="-22" width="8" height="30" fill="#F3D3A4"/></g>`;
  if (has('umbrella')) back += `<g transform="translate(${x - 44} ${y + 34}) rotate(-30)"><path d="M0 16 V-62" stroke="${INK}" stroke-width="2.7" stroke-linecap="round"/><path d="M-34 -58 Q0 -96 34 -58 Q23 -66 11 -58 Q0 -66 -11 -58 Q-23 -66 -34 -58Z" fill="#C3C5F8"/><path d="M0 -80 Q-10 -70 -11 -58 M0 -80 Q10 -70 11 -58" stroke="${INK}" stroke-width="1.7" fill="none"/></g>`;
  if (has('candle')) back += `<g transform="translate(${x + 8} ${y + 8})"><rect x="-6" y="-52" width="12" height="58" rx="3" fill="#FFFDF5"/><path d="M-6 -40 L6 -32 M-6 -24 L6 -16" stroke="#FFB3C8" stroke-width="4"/><path d="M0 -76 Q10 -64 0 -56 Q-10 -64 0 -76Z" fill="#F7CF8B"/></g>`;
  if (has('waffle')) back += `<g transform="translate(${x + 44} ${y + 30}) rotate(24)"><rect x="-27" y="-54" width="54" height="54" rx="9" fill="#F3D3A4"/><path d="M-27 -41 H27 M-27 -27 H27 M-27 -13 H27 M-14 -54 V0 M0 -54 V0 M14 -54 V0" stroke="#DFB27C" stroke-width="2.6"/></g>`;
  if (has('whipped')) front += `<g transform="translate(${x} ${y + 2})"><path d="M-40 12 Q-46 -6 -26 -8 Q-28 -24 -10 -24 Q-8 -38 8 -32 Q24 -30 22 -14 Q42 -12 38 8 Q36 18 22 16 Q0 24 -22 18 Q-36 22 -40 12Z" fill="#FFFDF5"/><path d="M-18 2 Q0 12 20 0 M-6 -14 Q4 -10 12 -16" stroke="#E5DCC6" stroke-width="3.5" fill="none" stroke-linecap="round"/></g>`;
  if (has('macaron')) front += `<g transform="translate(${x - 30} ${y + 9}) rotate(-14)"><rect x="-22" y="-5" width="44" height="10" rx="4" fill="#FFF6DA"/><path d="M-24 -4 Q-24 -19 0 -19 Q24 -19 24 -4 Q24 -2 21 -2 H-21 Q-24 -2 -24 -4Z" fill="#FFC6D5"/><path d="M-24 4 Q-24 19 0 19 Q24 19 24 4 Q24 2 21 2 H-21 Q-24 2 -24 4Z" fill="#FFC6D5"/><path d="M-13 -13 Q-5 -16 3 -15" fill="none" stroke="#FFF" stroke-width="2.4" stroke-linecap="round"/></g>`;
  if (has('mint')) front += `<g transform="translate(${x + 24} ${y + 8 - lift / 2})"><path d="M0 0 Q2 -24 28 -24 Q28 -2 0 0Z" fill="#6FBF62"/><path d="M0 0 Q-20 -18 -4 -34 Q12 -18 0 0Z" fill="#8AD17A"/></g>`;
  if (has('cherry')) front += `<g transform="translate(${x - 2} ${y - 6 - lift})"><path d="M2 -12 Q6 -30 22 -36" fill="none" stroke="#9C7A5E" stroke-width="2.7" stroke-linecap="round"/><circle r="15" fill="#EE6B83"/><ellipse cx="-5" cy="-5" rx="4" ry="3" fill="#FFB3C4"/></g>`;
  return { back, front };
}

// Faces: tiny dot eyes and soft blush, drawn small so they suit the quiet style.
function faceSVG(mood, x, y, s, f) {
  const c = '#5C544E';
  const blink = mood === 'nervous' || mood === 'ok' || mood === 'worried' ? 'class="eyes"' : '';
  const eyes = (r = 4.2) => `<g ${blink}><ellipse cx="-17" cy="-4" rx="${r * .86}" ry="${r}" fill="${c}"/><ellipse cx="17" cy="-4" rx="${r * .86}" ry="${r}" fill="${c}"/></g>`;
  const blush = (o = .45) => `<ellipse cx="-29" cy="7" rx="8" ry="4.5" fill="#F2A7B6" opacity="${o}"/><ellipse cx="29" cy="7" rx="8" ry="4.5" fill="#F2A7B6" opacity="${o}"/>`;
  const line = d => `<path d="${d}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`;
  const drop = (sx, sy) => `<path d="M${sx} ${sy} q5 8 0 11 q-5 -3 0 -11Z" fill="#BFDDF0" opacity=".9"/>`;
  let g = '';
  switch (mood) {
    case 'happy':     g = line('M-22 -3 q5 -6 10 0 M12 -3 q5 -6 10 0') + blush(.55) + line('M-5 10 q5 5 10 0'); break;
    case 'starry': {   // star eyes: for the ones that made it into the Hall of Fame
      const star = cx => `<path transform="translate(${cx} -5) scale(.95)" d="M0 -11 l3.6 7.6 l8.4 1.1 l-6.1 5.8 l1.6 8.3 l-7.5 -4.1 l-7.5 4.1 l1.6 -8.3 l-6.1 -5.8 l8.4 -1.1Z" fill="#FFD95A" stroke="${c}" stroke-width="2" stroke-linejoin="round"/><circle cx="${cx - 2.4}" cy="-9" r="1.7" fill="#fff"/>`;
      g = star(-18) + star(18) + blush(.65) + `<path d="M-7 8 q7 10 14 0Z" fill="${c}"/>`; break; }
    case 'delighted': g = line('M-22 -2 q5 -7 10 0 M12 -2 q5 -7 10 0') + blush(.7) + `<path d="M-7 8 q7 10 14 0Z" fill="${c}"/>`; break;
    case 'ok':        g = eyes() + blush(.35) + line('M-4 11 h8'); break;
    case 'worried':   g = line('M-22 -14 l8 -3 M22 -14 l-8 -3') + eyes() + blush(.4) + line('M-5 13 q5 -4 10 0') + drop(32, -22); break;
    case 'panicked':  g = `<circle cx="-17" cy="-4" r="4.6" fill="none" stroke="${c}" stroke-width="2"/><circle cx="17" cy="-4" r="4.6" fill="none" stroke="${c}" stroke-width="2"/>` + blush(.4)
                        + `<ellipse cx="0" cy="13" rx="3.6" ry="4.4" fill="${c}"/>` + drop(34, -24) + drop(-38, -16); break;
    case 'dead':      g = line('M-21 -8 l7 7 M-14 -8 l-7 7 M14 -8 l7 7 M21 -8 l-7 7') + blush(.35) + line('M-4 11 h8'); break;
    case 'cool':      g = `<rect x="-27" y="-9" width="18" height="8" rx="4" fill="${c}"/><rect x="9" y="-9" width="18" height="8" rx="4" fill="${c}"/>` + line('M-9 -6 h18') + blush(.4) + line('M-4 10 q5 4 10 -1'); break;
    case 'sad':       g = eyes(3.8) + blush(.35) + line('M-5 13 q5 -4 10 0'); break;
    default:          g = eyes() + blush(.4) + line('M-8 11 q2.7 -3 5.3 0 t5.3 0') + drop(32, -20);   // nervous
  }
  return `<g transform="translate(${x} ${y}) scale(${s * 1.2})">${g}</g>`;
}

const biteMask = (id, bites, grow, center, clearY) => {
  const shapes = bites.map(([x, y, r]) => {
    const a = Math.atan2(center[1] - y, center[0] - x);
    const teeth = [-.8, -.27, .27, .8].map(o => {
      const tx = x + Math.cos(a + o) * r * .92, ty = y + Math.sin(a + o) * r * .92;
      return `<circle cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="${(r * .3 + grow).toFixed(1)}"/>`;
    }).join('');
    return `<circle cx="${x}" cy="${y}" r="${r + grow}"/>${teeth}`;
  }).join('');
  return `<mask id="${id}" maskUnits="userSpaceOnUse" x="-60" y="-120" width="380" height="500"><rect x="-60" y="-120" width="380" height="500" fill="#fff"/><g fill="#000">${shapes}${clearY ? `<rect x="-60" y="-120" width="380" height="${clearY + 120}"/>` : ''}</g></mask>`;
};

function iceCream({ form = 'cone', flavor = 'vanilla', toppings = [], decor = [], bites = 0, mood = 'nervous', crown = false, face = true, falling = false, headroom = false, label = '' } = {}) {
  const art = FORM_ART[form] || FORM_ART.other;
  const f = flavor === 'blank' ? BLANK_FLAVOR : FLAVORS[flavor] || FLAVORS.other;
  const id = 'i' + (++svgId);
  const drawn = Math.min(bites, art.bites.length);
  const used = art.bites.slice(0, drawn);
  const melt = Math.min(1, bites / 8);
  let spot = art.faces[0];
  art.faces.forEach(fc => { if (drawn >= fc[0]) spot = fc; });

  const puddleW = 20 + melt * 84;
  const puddle = bites > 0 ? `<ellipse cx="${art.tip[0]}" cy="${art.tip[1] + 6}" rx="${puddleW}" ry="${5 + melt * 7}" fill="${f.base}"/>` : '';
  const droplet = falling ? `<path class="fall" d="M${art.tip[0]} ${art.tip[1] - 2} q6 9 0 13 q-6 -4 0 -13Z" fill="${f.base}"/>` : '';
  const crownSvg = crown ? `<g transform="translate(130 ${decor.length ? -24 : -8})"><path d="M-44 12 L-52 -32 L-22 -10 L0 -42 L22 -10 L52 -32 L44 12 Z" fill="#FFE98F"/><circle cy="-2" r="6" fill="#EE6B83"/></g>` : '';
  let clearY = 0;   // once an area is mostly eaten, sweep away any floating crumbs above this line
  (art.clear || []).forEach(c => { if (drawn >= c[0]) clearY = c[1]; });
  const masks = used.length ? biteMask(id + 'a', used, 0, art.center, clearY) : '';
  const m = suffix => used.length ? `mask="url(#${id}${suffix})"` : '';

  const tall = crown || headroom || decor.length > 0;
  // Decorations sit on top, so they're gone by the third bite.
  const deco = decor.length && drawn < 3 ? decorSVG(decor, art.top[0], art.top[1]) : { back: '', front: '' };
  const toppingArt = toppings.length
    ? `<clipPath id="c${id}">${art.sil}</clipPath><g clip-path="url(#c${id})">${toppings.map(t => toppingSVG(t, f, art.area, art.faces[0].slice(1))).join('')}</g>` : '';
  return `<svg class="ic" viewBox="-6 ${tall ? -72 : -6} 272 ${tall ? 422 : 356}" preserveAspectRatio="xMidYMax meet" role="img" aria-label="${esc(label || `${f.short} ${form}`)}">
    <defs>${masks}</defs>
    ${puddle}${art.back || ''}
    ${deco.back ? `<g ${m('a')}>${deco.back}</g>` : ''}
    <g ${m('a')}>${art.art(f, id, melt)}${toppingArt}${deco.front}</g>
    ${art.front || ''}${droplet}
    ${face ? faceSVG(mood, spot[1], spot[2], spot[3], f) : ''}
    ${crownSvg}
  </svg>`;
}

/* ==========================================================================
   GAME STATE
   "game" is the ice cream currently being eaten. It is saved after every bite,
   so closing the tab, or a phone going to sleep, doesn't lose it.
   ========================================================================== */
let game = loadCurrentGame();
let draft = null;     // what's on the workbench so far
let fresh = null;     // id of the record that just got its verdict (plays the big reveal once)
let freshGrave = null;// id of a tombstone to raise when the graveyard next opens
let homeTaps = 0;

function loadCurrentGame() {
  try { return JSON.parse(storeGet(CURRENT_KEY)); } catch (e) { return null; }
}
function saveCurrentGame() {
  if (game) storeSet(CURRENT_KEY, JSON.stringify(game)); else storeDelete(CURRENT_KEY);
}
function startDraft(changedMind = false) {
  draft = { form: null, flavor: null, toppings: [], decor: [], reason: null, name: '', place: '', placeOther: '', loc: '', changedMind };
}
function beginGame() {
  const name = draft.name.trim() || defaultName(draft.flavor, draft.form);
  const prediction = predictSurvival(draft.form, draft.flavor, allRecords(), draft.toppings);
  const place = draft.place === PLACE_OTHER_LABEL ? draft.placeOther.trim() : draft.place;
  game = {
    id: newId(),
    date: new Date().toISOString(),
    name, place, form: draft.form, flavor: draft.flavor, toppings: draft.toppings, decor: draft.decor, reason: draft.reason,
    loc: LOCATIONS[draft.loc] ? draft.loc : '', changedMind: !!draft.changedMind,
    prediction, stage: 'loading',
    bites: 0, firstReaction: null, laterReactions: [], asked: [], stopReason: null, lastSay: null,
    challenge: null, rest: null, mode: 'game', said: [],
    loadingLine: pick(COPY.loading),
  };
  draft = null;
  saveCurrentGame();
}
function checkpointFor(bite) {
  if (CHECKPOINT_AT[bite]) return CHECKPOINT_AT[bite];
  const r = CHECKPOINT_REPEAT;
  return bite > r.after && (bite - r.after) % r.every === 0 ? r.ask : null;
}
function lastScore(g) {
  const later = g.laterReactions[g.laterReactions.length - 1];
  return later ? later.score : g.firstReaction ? g.firstReaction.score : null;
}
// More bites = more distress, unless the latest reaction was very positive.
function moodFor(g) {
  const s = lastScore(g);
  if (g.bites === 0) return 'nervous';
  if (s === 5 && g.bites < 12) return 'delighted';
  if (s === 1) return 'panicked';
  if (g.bites >= 9) return 'panicked';
  if (s === 4 && g.bites < 6) return 'happy';
  if (s === 2 || g.bites >= 6) return 'worried';
  return g.bites >= 3 ? 'nervous' : 'ok';
}
function biteStatus(g) {
  const c = COPY.biteStatus, p = g.prediction.predictedBites;
  if (g.bites >= 25) return c.veryLong;
  if (g.bites > MAX_DRAWN_BITES + 1) return c.nothingLeft;
  if (g.lastSay && g.lastSayBite === g.bites) return g.lastSay;
  if (g.bites === 0) return c.start;
  if (g.bites === p) return c.atPrediction;
  if (g.bites >= p + 3) return c.farPast;
  if (g.bites > p) return c.pastPrediction;
  if (g.bites === 2) return c.friend;
  const left = p - g.bites;
  return `The machine gives it ${left} more bite${left === 1 ? '' : 's'}.`;
}
// Turns the game into a saved record. Used by the full game and by Quick Record,
// so both produce exactly one record, through the same rules.
function endGame(finished, rebuy) {
  const g = game;
  if (!g || findRecord(g.id)) { game = null; saveCurrentGame(); return; }   // a double tap can't save it twice
  const record = finaliseRecord({
    id: g.id, kind: 'bought', date: g.date, name: g.name, place: g.place, form: g.form,
    flavorCategory: g.flavor, toppings: g.toppings, decorations: g.decor, reasonForBuying: g.reason,
    predictedBites: g.prediction.predictedBites,
    predictionConfidence: g.prediction.confidence,
    predictionConfidenceScore: g.prediction.confidenceScore,
    finishOddsOneIn: g.prediction.finishOddsOneIn,
    actualBites: g.bites, finished,
    firstReaction: g.firstReaction, laterReactions: g.laterReactions,
    stopReason: finished ? null : g.stopReason, repurchase: rebuy,
    mode: g.mode || 'game',
    ...(!finished && g.rest ? { rest: g.rest } : {}),
    ...(g.loc ? { loc: g.loc } : {}),
    ...(g.changedMind ? { changedMind: true } : {}),
  });
  const advice = chooseAdvice(record);   // the machine's advice is decided once, here, and remembered
  if (advice) record.advice = advice;
  saveRecord(record);
  game = null;
  saveCurrentGame();
  fresh = record.id;
  if (!record.finished && inGraveyard(record)) freshGrave = record.id;
  go('result/' + record.id);
}

    const on = isOn(b.dataset.val); b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on));

  syncGroup('pickFlavor', v => d.flavor === v);

  syncGroup('pickDecor', v => d.decor.includes(v));

  document.querySelectorAll('[data-formthumb]').forEach(el => { el.innerHTML = iceCream({ form: el.dataset.formthumb, flavor: d.flavor || 'blank', face: false }); });

  return `<section class="screen" id="result"><div class="verdict v2">

/* --- ARCHIVE: magnets on a freezer door -------------------------------------------- */
function learningNote(s) {
  if (s.earlyError === null) return 'Too early to say if it’s learning. It is, however, very sure of itself.';
  const diff = s.earlyError - s.lateError;
  if (diff > .75) return `It’s improving: off by ${s.earlyError.toFixed(1)} bites on average at first, ${s.lateError.toFixed(1)} lately. Do something about that.`;
  if (diff < -.75) return `It has more data than ever and is getting worse: ${s.earlyError.toFixed(1)} bites off at first, ${s.lateError.toFixed(1)} lately.`;
  return `All this data and it’s still off by about ${s.avgError.toFixed(1)} bites. Taste remains annoyingly personal.`;
}

    <div class="magnets">

}

/* --- DETAIL CARD (opens from Graveyard, Hall of Fame and Archive) ---------------------- */
function openCard(id) {

  const v = verdictOf(r);

  const when = new Date(r.date);
  const dateText = isNaN(when) ? '' : when.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
  const reactions = [r.firstReaction && `Bite 1: ${r.firstReaction.label}`, ...(r.laterReactions || []).map(x => `Bite ${x.bite}: ${x.label}`)].filter(Boolean);

  overlay.innerHTML = `<div class="sheet" style="--sheet:${f.flood}">
    <div class="card-top">
      <div class="chr">${iceCream({ form: r.form, flavor: r.flavorCategory, toppings: r.toppings || [], decor: r.decorations || [], bites: v.id === 'approved' ? 0 : r.finished ? Math.max(r.actualBites, 12) : r.actualBites, mood: v.id === 'approved' ? 'starry' : r.finished ? 'cool' : 'dead', crown: v.id === 'approved', label: r.name })}</div>
      <div><h2 class="chunky">${esc(r.name)}</h2>${demoMark(r)}<br><span class="sticker" style="background:${colorVar(v.color)}">${esc(v.title)}</span></div>
    </div>

    <div class="chunky scoreboard" style="margin-top:10px">
      <div>PREDICTED<b>${r.predictedBites}</b></div><div>ACTUAL<b>${r.actualBites}</b></div>
    </div>
    <p class="chunky center" style="font-size:18px;margin-top:12px">${esc(accuracyHeadline(r.predictionError))}</p>
    <dl class="facts">
      ${dateText ? `<dt>Date</dt><dd>${esc(dateText)}</dd>` : ''}
      ${r.place ? `<dt>From</dt><dd>${esc(r.place)}</dd>` : ''}
      <dt>Type</dt><dd>${esc(f.short[0].toUpperCase() + f.short.slice(1))}, ${esc((FORMS[r.form] ? FORMS[r.form].label : r.form).toLowerCase())}</dd>
      ${(r.toppings || []).length ? `<dt>Toppings</dt><dd>${r.toppings.map(t => esc(TOPPINGS[t].short)).join(', ')}</dd>` : ''}
      ${(r.decorations || []).length ? `<dt>Decorations</dt><dd>${r.decorations.map(t => esc(DECORATIONS[t].short)).join(', ')}</dd>` : ''}
      <dt>Why</dt><dd>${esc(r.reasonForBuying ? REASONS[r.reasonForBuying].short : 'Unexplained')}</dd>
      <dt>Machine’s confidence</dt><dd>${esc(r.predictionConfidence)}</dd>
      ${reactions.length ? `<dt>Reactions</dt><dd>${reactions.map(esc).join('<br>')}</dd>` : ''}
      ${r.stopReason ? `<dt>Cause of death</dt><dd>${esc(STOP_REASONS[r.stopReason].short)}</dd>` : ''}
      ${r.whyStop && WHY_STOP[r.whyStop] ? `<dt>Why you stopped</dt><dd>${esc(WHY_STOP[r.whyStop].short)}</dd>` : ''}
      <dt>Buy again?</dt><dd>${esc(rebuyText)}</dd>
      ${LOCATIONS[r.loc] ? `<dt>Place</dt><dd>${esc(LOCATIONS[r.loc].label)}</dd>` : ''}
      ${r.mode === 'quick' ? `<dt>Recorded</dt><dd>Afterwards, with Quick Record</dd>` : ''}
      ${ADVICE[r.advice] ? `<dt>Machine’s advice</dt><dd>${esc(ADVICE[r.advice])}</dd>` : ''}

}

/* --- Small effects ---------------------------------------------------------------------- */
function confetti(count = 70) {
  if (reducedMotion()) return;
  const colors = ['#F4C7D0', '#D8E6C8', '#D6D7EE', '#F4E3B0', '#EFD3B4', '#FFFFFF'];
  for (let i = 0; i < count; i++) {
    const s = document.createElement('i');
    s.className = 'sprinkle';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.background = pick(colors);
    s.style.setProperty('--t', (1.2 + Math.random() * 1.1) + 's');
    s.style.setProperty('--d', (Math.random() * .5) + 's');
    s.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
    s.style.setProperty('--rot', (Math.random() * 900 - 450) + 'deg');
    fxLayer.appendChild(s);
    setTimeout(() => s.remove(), 3000);
  }
}
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status');
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

/* ==========================================================================
   MEMORY FREEZER: drawings, the freezer screen and the melting memory view.
   The data and words are in MEMORIES / MEMORY_COPY near the top of the file.
   ========================================================================== */
const ALL_MEMORIES = [...MEMORIES, MEMORY_MORE];
// A game record can be opened the same way (see recordMemory in the expansion); it is never one of the 22.
const memoryById = id => ALL_MEMORIES.find(m => m.id === id) || recordMemory(id);
const THAWED_KEY = 'willYouFinishIt.thawedMemories.v1';   // which memories this phone has opened (just for the frost)
function thawedList() { try { const v = JSON.parse(storeGet(THAWED_KEY)); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
function markThawed(id) { const list = thawedList(); if (!list.includes(id)) { list.push(id); storeSet(THAWED_KEY, JSON.stringify(list)); } }
const seriesOf = m => Object.entries(MEMORY_SERIES).filter(([, s]) => s.ids.includes(m.id));
const MEM_STEPS = { cup: 4, popsicle: 4, ghost: 3, special: 4 };
const memStyle = m => m.kind === 'special' ? m.art.special : m.kind;   // cup, popsicle, ghost, affogato, bowl, smash, matching

/* --- Drawings. Every memory is drawn in a 200 x 230 box. --------------------------
   Parts that melt read CSS variables set on the page: --m (0 frozen, 1 gone) and,
   for popsicles, --u (0 wrapped, 1 unwrapped). */
const MEM_INK = INK;
const qFlag = (x, y, rot = 14) => `<g transform="translate(${x} ${y}) rotate(${rot})"><path d="M0 0 V-34" stroke="${MEM_INK}" stroke-width="2.4" stroke-linecap="round"/><path d="M0 -34 L26 -28 L0 -20Z" fill="#FFFEFA"/><text x="9" y="-23.5" font-family="Puffy Scoop, ZH Bold, sans-serif" font-size="10" fill="${MEM_INK}" text-anchor="middle">?</text></g>`;

function cupPattern(a, clip) {
  const s = `stroke="${a.accent}"`;
  const g = inner => `<g clip-path="url(#${clip})">${inner}</g>`;
  switch (a.pattern) {
    case 'dots':    return g([[68, 140], [96, 132], [124, 142], [80, 168], [110, 164], [136, 170], [92, 192], [120, 194]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="5.5" fill="${a.accent}"/>`).join(''));
    case 'stripes': return g(`<path d="M72 118 L77 210 M94 118 L95 212 M112 118 L110 212 M132 118 L126 210" ${s} stroke-width="9"/>`);
    case 'film':    return g(`<rect x="40" y="148" width="120" height="30" fill="${a.accent}"/>${[52, 68, 84, 100, 116, 132, 148].map(x => `<rect x="${x}" y="151" width="7" height="5" rx="1.5" fill="#FFFEFA"/><rect x="${x}" y="170" width="7" height="5" rx="1.5" fill="#FFFEFA"/>`).join('')}`);
    case 'stars':   return g([[70, 140], [104, 134], [132, 150], [86, 170], [118, 178], [100, 198]].map(([x, y]) => `<path transform="translate(${x} ${y})" d="M0 -8 Q1.4 -1.4 8 0 Q1.4 1.4 0 8 Q-1.4 1.4 -8 0 Q-1.4 -1.4 0 -8Z" fill="${a.accent}"/>`).join(''));
    case 'waves':   return g(`<path d="M40 146 q10 -8 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 M40 172 q10 -8 20 0 t20 0 t20 0 t20 0 t20 0 t20 0" ${s} stroke-width="6" fill="none"/>`);
    case 'zigzag':  return g(`<path d="M40 158 l12 -12 l12 12 l12 -12 l12 12 l12 -12 l12 12 l12 -12 l12 12 l12 -12 l12 12" ${s} stroke-width="7" fill="none" stroke-linejoin="round"/>`);
  }
  return '';
}
function scoopShape(x, y, r, fill, speck) {
  const bumps = [-0.86, -0.43, 0, 0.43, 0.86].map(t => `<circle cx="${x + t * r}" cy="${y + r * .5}" r="${r * .27}"/>`).join('');
  const specks = speck ? [[-.4, -.3], [.3, -.45], [.45, .05], [-.15, .1], [-.55, .15], [.1, -.7]].map(([dx, dy]) => `<path d="M${x + dx * r - 4} ${y + dy * r} l3 -3 l5 1 l-1 4Z" fill="${speck}"/>`).join('') : '';
  return `<g fill="${fill}"><path d="M${x - r} ${y + r * .45} C${x - r * 1.05} ${y - r * .55} ${x - r * .5} ${y - r} ${x} ${y - r} C${x + r * .5} ${y - r} ${x + r * 1.05} ${y - r * .55} ${x + r} ${y + r * .45}Z"/>${bumps}</g>
    <g stroke="none"><path d="M${x - r} ${y + r * .45} C${x - r * 1.05} ${y - r * .55} ${x - r * .5} ${y - r} ${x} ${y - r} C${x + r * .5} ${y - r} ${x + r * 1.05} ${y - r * .55} ${x + r} ${y + r * .45}Z" fill="${fill}"/>${[-0.86, -0.43, 0, 0.43, 0.86].map(t => `<circle cx="${x + t * r}" cy="${y + r * .5}" r="${r * .27 - 1.5}" fill="${fill}"/>`).join('')}
    <ellipse cx="${x - r * .42}" cy="${y - r * .48}" rx="${r * .26}" ry="${r * .14}" transform="rotate(-28 ${x - r * .42} ${y - r * .48})" fill="#fff" opacity=".6"/>${specks}</g>`;
}
function puddle(color, base = .25) {
  return `<ellipse class="mx-puddle" style="--bp:${base}" cx="100" cy="214" rx="78" ry="10" fill="${color}"/>`;
}
function snowflakes() {
  return [[22, 40, 9], [178, 64, 7], [30, 150, 6], [176, 170, 8], [56, 18, 5]].map(([x, y, r]) => `<g transform="translate(${x} ${y})" stroke="#A9CBEA" stroke-width="2" stroke-linecap="round"><path d="M0 ${-r} V${r} M${-r * .87} ${-r / 2} L${r * .87} ${r / 2} M${-r * .87} ${r / 2} L${r * .87} ${-r / 2}"/></g>`).join('');
}

function cupArt(a) {

// One popsicle with its wrapper. The wrapper tears down the middle.
function onePopsicle(a, unknown) {
  const id = 'mp' + (++svgId);
  const top = 34, bot = 186, L = 58, Rt = 142;
  let tear = '';
  for (let y = top + 4, i = 0; y <= bot - 4; y += 9, i++) tear += ` L${100 + (i % 2 ? 4 : -4)} ${y}`;
  const crimpTop = side => { let d = ''; for (let x = side < 0 ? L : 100, i = 0; side < 0 ? x <= 100 : x <= Rt; x += 7, i++) d += ` L${x} ${top + (i % 2 ? 0 : 9)}`; return d; };
  const crimpBot = side => { let d = ''; for (let x = side < 0 ? 100 : Rt, i = 0; side < 0 ? x >= L : x >= 100; x -= 7, i++) d += ` L${x} ${bot - (i % 2 ? 0 : 9)}`; return d; };
  const left = `M${L} ${top + 9}${crimpTop(-1)}${tear} L100 ${bot}${crimpBot(-1)} Z`;
  const right = `M100 ${top + 9}${crimpTop(1)} L${Rt} ${bot}${crimpBot(1)}${tear.split(' L').reverse().filter(Boolean).map(p => ' L' + p).join('')} Z`;
  const label = `<ellipse cx="100" cy="110" rx="34" ry="19" fill="#FFFEFA"/><text x="100" y="${a.label ? 113.5 : 117}" font-family="Puffy Scoop, ZH Bold, sans-serif" font-size="${a.label ? 10 : 20}" fill="${MEM_INK}" text-anchor="middle">${a.label ? esc(a.label) : '?'}</text>`;
  const half = (d, cls, cid) => `<g class="${cls}"><defs><clipPath id="${cid}"><path d="${d}"/></clipPath></defs><path d="${d}" fill="${a.wrap}"/>
      <g clip-path="url(#${cid})"><path d="M64 34 V190 M134 34 V190" stroke="#fff" stroke-width="7" opacity=".55"/>${label}</g></g>`;
  return `<rect x="92" y="150" width="16" height="56" rx="7" fill="#F3D3A4"/>
    <g class="mx-scoop"><rect x="72" y="46" width="56" height="120" rx="26" fill="${a.bar}"/><rect x="80" y="62" width="9" height="78" rx="4.5" fill="#fff" opacity=".65"/>${unknown ? `<text x="108" y="118" font-family="Puffy Scoop, ZH Bold, sans-serif" font-size="22" fill="${MEM_INK}" opacity=".55" text-anchor="middle">?</text>` : ''}</g>
    <path class="mx-drip" style="--bd:.2" d="M94 164 v6 a5 5 0 0 0 10 0 v-6Z" fill="${a.bar}"/>
    ${half(left, 'mx-wl', id + 'l')}${half(right, 'mx-wr', id + 'r')}`;
}
const DESSERT_ICONS = {
  cookie:  `<circle r="13" fill="#E8C296"/><circle cx="-4" cy="-3" r="2.4" fill="#8C6248"/><circle cx="5" cy="-5" r="2" fill="#8C6248"/><circle cx="2" cy="5" r="2.4" fill="#8C6248"/><circle cx="-6" cy="5" r="1.6" fill="#8C6248"/>`,
  pudding: `<path d="M-12 10 L-8 -6 Q0 -12 8 -6 L12 10Z" fill="#FFE29A"/><path d="M-8 -6 Q0 -12 8 -6 Q8 -1 4 -1 Q2 3 0 -1 Q-3 2 -5 -1 Q-8 -1 -8 -6Z" fill="#B97F4F"/>`,

  tart:    `<circle r="13" fill="#EBC48F"/><circle r="8.5" fill="#FFD86B"/><circle cx="-2" cy="-2" r="2.4" fill="#F2A65A" opacity=".7"/>`,
  danish:  `<circle r="13" fill="#F0C98F"/><path d="M0 0 m-7 0 a7 7 0 1 1 7 7 a4 4 0 1 1 -4 -4" fill="none" stroke="#C98B4E" stroke-width="2.4" stroke-linecap="round"/><circle r="3" fill="#EE6B83"/>`,

function popsicleArt(a) {

  const one = n => { const label = (a.labels || [])[n] ?? a.label; return { ...a, bar: (a.bars || [])[n] ?? a.bar, label: label === '?' ? '' : label }; };

}

function refreshFreezerRecords() {
  const d = document.querySelector('#chest .fresh-drawer');
  if (d) d.outerHTML = freshDrawerButton();
  const want = decodeURIComponent(location.hash.split('/')[1] || '');   // a record that wasn't here yet when the page opened
  if (want && !['fresh', 'stories', 'story'].includes(want) && fz.sel !== want && memoryById(want)) { fz = { ...fz, mode: 'all', view: 'memory', sel: want }; renderStage(false); }

  // a record on the stage may have gained a kept memory; redraw it unless it is halfway through melting
  else if (fz.view === 'memory' && (memoryById(fz.sel) || {}).isRecord && (!memState || memState.p === 0 || memState.done)) renderStage(false);

// Which ice creams the chest is pointing at right now
function chestState() {

  document.querySelectorAll('#chest .cmem').forEach(el => {
    const id = el.dataset.val, m = memoryById(id);
    const inStory = story && story.ids.includes(id);
    el.classList.toggle('on', fz.sel === id && (fz.view === 'memory' || fz.view === 'story'));
    el.classList.toggle('lift', !!inStory);
    el.classList.toggle('dim', story ? !inStory : fz.mode === 'all' && fz.filter !== 'all' && m.kind !== fz.filter);
    el.classList.toggle('thawed', thawedList().includes(id));
    if (inStory) el.dataset.order = story.ids.indexOf(id) + 1; else delete el.dataset.order;

// read #freezer, #freezer/<id>, #freezer/fresh, #freezer/stories, #freezer/story/<key>/<n>
function freezerFromHash(param, extra, more) {

  else if (param === 'stories') fz = { ...fz, mode: 'stories', view: 'stories' };
  else if (param === 'story' && MEMORY_SERIES[extra] && STORY_KEYS.includes(extra)) {
    const n = Math.max(0, Math.min(MEMORY_SERIES[extra].ids.length - 1, (parseInt(more, 10) || 1) - 1));
    fz = { ...fz, mode: 'stories', view: 'story', story: extra, step: n, sel: MEMORY_SERIES[extra].ids[n] };
  } else if (param && memoryById(param)) {

// The string that ties a story together: only while a story is chosen.

  const svg = document.getElementById('threads'), chest = document.getElementById('chest');
  if (!svg || !chest) return;
  const story = fz.view === 'story' ? MEMORY_SERIES[fz.story] : null;
  if (!story) { svg.innerHTML = ''; return; }
  const box = chest.getBoundingClientRect();
  svg.setAttribute('viewBox', `0 0 ${box.width} ${box.height}`);
  const pts = story.ids.map(id => {
    const el = chest.querySelector(`.cmem[data-val="${id}"] .cmem-art`);
    if (!el) return null;
    const r = el.getBoundingClientRect();
    return [r.left - box.left + r.width / 2, r.top - box.top + r.height * .55];
  }).filter(Boolean);
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let k = 1; k < pts.length; k++) {
    const [x0, y0] = pts[k - 1], [x1, y1] = pts[k];
    d += ` C${x0 + (x1 - x0) * .3} ${Math.max(y0, y1) + 26} ${x0 + (x1 - x0) * .7} ${Math.max(y0, y1) + 26} ${x1} ${y1}`;

// A memory as a page of its own: only from the workbench, so it can lead back there.
