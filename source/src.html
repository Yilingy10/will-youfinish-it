// Repeatable pseudo-random numbers, so a topping lands in the same place every time.
function seeded(text) {
  let h = 2166136261;
  for (const c of text) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return (h >>> 0) / 4294967296; };
}
function scatter(key, [cx, cy, rx, ry], count, avoid) {
  const rnd = seeded(key), pts = [];
  for (let tries = 0; pts.length < count && tries < count * 15; tries++) {
    const a = rnd() * Math.PI * 2, r = Math.sqrt(rnd());
    const x = cx + Math.cos(a) * r * rx, y = cy + Math.sin(a) * r * ry;
    if (avoid && ((x - avoid[0]) / (44 * avoid[2])) ** 2 + ((y - avoid[1]) / (30 * avoid[2])) ** 2 < 1) continue;
    if (pts.some(p => Math.hypot(p[0] - x, p[1] - y) < 13)) continue;
    pts.push([x, y, rnd()]);
  }
  return pts;
}
// TOPPING DRAWINGS: each one scatters small shapes over "area".
function toppingSVG(key, f, area, avoid, size = 1) {
  const pts = n => scatter(key + f.short, area, n, avoid);
  const rot = (p, d) => `transform="rotate(${Math.round(p[2] * 360)} ${p[0].toFixed(1)} ${p[1].toFixed(1)}) translate(${p[0].toFixed(1)} ${p[1].toFixed(1)}) scale(${size})"`;
  const brown = f.short === 'chocolate' || f.short === 'coffee';
  switch (key) {
    case 'sprinkles': return pts(16).map((p, i) => `<g ${rot(p)}><rect x="-7" y="-2.6" width="14" height="5.2" rx="2.6" fill="${['#EE6B83', '#FFE98F', '#C3C5F8', '#FFFDF5', '#CFE8B0', '#FFB3C8'][i % 6]}"/></g>`).join('');
    case 'chips':     return pts(10).map(p => `<g ${rot(p)}><path d="M0 -7 Q7 3 5 5 Q0 8 -5 5 Q-7 3 0 -7Z" fill="${f.short === 'chocolate' ? '#FFF2C4' : '#7F5A45'}"/></g>`).join('');
    case 'nuts':      return pts(9).map(p => `<g ${rot(p)}><path d="M-8 1 L-3 -6 L6 -5 L8 3 L0 7Z" fill="#D9A566"/></g>`).join('');
    case 'cookie':    return pts(8).map(p => `<g ${rot(p)}><path d="M-9 -2 L-2 -8 L8 -5 L7 5 L-3 8Z" fill="#C9A17E"/><circle cx="-1" cy="0" r="1.8" fill="#8F6A50"/><circle cx="4" cy="-2" r="1.1" fill="#8F6A50"/><circle cx="-4" cy="3" r="1" fill="#8F6A50"/></g>`).join('');
    case 'fruit':     return pts(9).map((p, i) => `<g ${rot(p)}><rect x="-6.5" y="-6.5" width="13" height="13" rx="3" fill="${['#EE6B83', '#F7CF8B', '#CFE8B0'][i % 3]}"/></g>`).join('');
    case 'mochi':     return pts(7).map(p => `<g ${rot(p)}><rect x="-9" y="-8" width="18" height="16" rx="7" fill="#FFFDF5"/></g>`).join('');
    case 'boba':      return pts(9).map(p => `<g transform="translate(${p[0].toFixed(1)} ${p[1].toFixed(1)}) scale(${size})"><circle r="8" fill="#D9B48F"/><circle r="4.2" fill="#C59C76"/><circle cx="-3.8" cy="-4" r="1.6" fill="#FFFDF5" opacity=".85"/></g>`).join('');
    case 'popcorn':   return pts(8).map(p => `<g ${rot(p)}><path d="M-3 -7 a4.6 4.6 0 0 1 7 2 a4.6 4.6 0 0 1 3 7 a4.6 4.6 0 0 1 -6 3 a4.6 4.6 0 0 1 -7 -2 a4.6 4.6 0 0 1 -1 -7 a4.6 4.6 0 0 1 4 -3Z" fill="#FFF6DA"/><circle cx="0.5" cy="1" r="2.1" fill="#F4C879"/></g>`).join('');
    case 'jam': {
      const [cx, cy, rx, ry] = area, y = cy - ry * .56, w = (rx * 2 + 24) / 6, x0 = cx - rx - 12, top = cy - ry * 3;
      let wave = '';
      [ry * .2, ry * .42, ry * .1, ry * .34, ry * .16, ry * .4].forEach(d => { wave += `q${w / 2} ${d * 2} ${w} 0 `; });
      const seeds = scatter('jam' + f.short, [cx, y - ry * .08, rx * .8, ry * .22], 7).map(p => `<ellipse cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" rx="1.4" ry="2.1" fill="#FFE7A8"/>`).join('');
      return `<path d="M${x0} ${top} V${y} ${wave} V${top} Z" fill="#EE7C96"/>${seeds}<path d="M${cx - rx * .62} ${y - ry * .12} q${rx * .22} ${-ry * .2} ${rx * .46} ${-ry * .14}" fill="none" stroke="#FFD6E0" stroke-width="3.4" stroke-linecap="round"/>`;
    }
    case 'sauce': {
      const [cx, cy, rx, ry] = area, y = cy - ry * .34, c = brown ? '#FFB3C8' : '#B08A70';
      const w = (rx * 2 + 24) / 6, x0 = cx - rx - 12;
      let wave = '';
      [ry * .3, ry * .08, ry * .46, ry * .12, ry * .36, ry * .05].forEach((d, i) => { wave += `q${w / 2} ${d * 2} ${w} 0 `; });
      return `<path d="M${x0} ${cy - ry * 3} V${y} ${wave} V${cy - ry * 3} Z" fill="${c}"/>`;
    }
  }
  return '';
}
// DECORATION DRAWINGS: placed at the top of the ice cream. "back" goes behind it, "front" over it.
function decorSVG(list, x, y) {
  const has = k => list.includes(k);
  const lift = has('whipped') ? 26 : 0;
  let back = '', front = '';
  if (has('wafer')) back += `<g transform="translate(${x + 26} ${y + 22}) rotate(20)"><rect x="-10" y="-82" width="20" height="96" rx="5" fill="#F3D3A4"/><path d="M-9 -66 L9 -54 M-9 -46 L9 -34 M-9 -26 L9 -14" stroke="#E3BA86" stroke-width="3.5"/></g>`;
  if (has('pocky')) back += `<g transform="translate(${x - 26} ${y + 22}) rotate(-18)"><rect x="-6" y="-90" width="12" height="106" rx="6" fill="#B08A70"/><rect x="-4" y="-22" width="8" height="30" fill="#F3D3A4"/></g>`;
  if (has('umbrella')) back += `<g transform="translate(${x - 44} ${y + 34}) rotate(-30)"><path d="M0 16 V-62" stroke="${INK}" stroke-width="2.7" stroke-linecap="round"/><path d="M-34 -58 Q0 -96 34 -58 Q23 -66 11 -58 Q0 -66 -11 -58 Q-23 -66 -34 -58Z" fill="#C3C5F8"/><path d="M0 -80 Q-10 -70 -11 -58 M0 -80 Q10 -70 11 -58" stroke="${INK}" stroke-width="1.7" fill="none"/></g>`;
  if (has('candle')) back += `<g transform="translate(${x + 8} ${y + 8})"><rect x="-6" y="-52" width="12" height="58" rx="3" fill="#FFFDF5"/><path d="M-6 -40 L6 -32 M-6 -24 L6 -16" stroke="#FFB3C8" stroke-width="4"/><path d="M0 -76 Q10 -64 0 -56 Q-10 -64 0 -76Z" fill="#F7CF8B"/></g>`;
  if (has('waffle')) back += `<g transform="translate(${x + 44} ${y + 30}) rotate(24)"><rect x="-27" y="-54" width="54" height="54" rx="9" fill="#F3D3A4"/><path d="M-27 -41 H27 M-27 -27 H27 M-27 -13 H27 M-14 -54 V0 M0 -54 V0 M14 -54 V0" stroke="#DFB27C" stroke-width="2.6"/></g>`;
  if (has('whipped')) front += `<g transform="translate(${x} ${y + 2})"><path d="M-40 12 Q-46 -6 -26 -8 Q-28 -24 -10 -24 Q-8 -38 8 -32 Q24 -30 22 -14 Q42 -12 38 8 Q36 18 22 16 Q0 24 -22 18 Q-36 22 -40 12Z" fill="#FFFDF5"/><path d="M-18 2 Q0 12 20 0 M-6 -14 Q4 -10 12 -16" stroke="#E5DCC6" stroke-width="3.5" fill="none" stroke-linecap="round"/></g>`;
  if (has('macaron')) front += `<g transform="translate(${x - 30} ${y + 9}) rotate(-14)"><rect x="-22" y="-5" width="44" height="10" rx="4" fill="#FFF6DA"/><path d="M-24 -4 Q-24 -19 0 -19 Q24 -19 24 -4 Q24 -2 21 -2 H-21 Q-24 -2 -24 -4Z" fill="#FFC6D5"/><path d="M-24 4 Q-24 19 0 19 Q24 19 24 4 Q24 2 21 2 H-21 Q-24 2 -24 4Z" fill="#FFC6D5"/><path d="M-13 -13 Q-5 -16 3 -15" fill="none" stroke="#FFF" stroke-width="2.4" stroke-linecap="round"/></g>`;
  if (has('mint')) front += `<g transform="translate(${x + 24} ${y + 8 - lift / 2})"><path d="M0 0 Q2 -24 28 -24 Q28 -2 0 0Z" fill="#6FBF62"/><path d="M0 0 Q-20 -18 -4 -34 Q12 -18 0 0Z" fill="#8AD17A"/></g>`;
  if (has('cherry')) front += `<g transform="translate(${x - 2} ${y - 6 - lift})"><path d="M2 -12 Q6 -30 22 -36" fill="none" stroke="#9C7A5E" stroke-width="2.7" stroke-linecap="round"/><circle r="15" fill="#EE6B83"/><ellipse cx="-5" cy="-5" rx="4" ry="3" fill="#FFB3C4"/></g>`;
  return { back, front };
}

// Faces: tiny dot eyes and soft blush, drawn small so they suit the quiet style.
function faceSVG(mood, x, y, s, f) {
  const c = '#5C544E';
  const blink = mood === 'nervous' || mood === 'ok' || mood === 'worried' ? 'class="eyes"' : '';
  const eyes = (r = 4.2) => `<g ${blink}><ellipse cx="-17" cy="-4" rx="${r * .86}" ry="${r}" fill="${c}"/><ellipse cx="17" cy="-4" rx="${r * .86}" ry="${r}" fill="${c}"/></g>`;
  const blush = (o = .45) => `<ellipse cx="-29" cy="7" rx="8" ry="4.5" fill="#F2A7B6" opacity="${o}"/><ellipse cx="29" cy="7" rx="8" ry="4.5" fill="#F2A7B6" opacity="${o}"/>`;
  const line = d => `<path d="${d}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`;
  const drop = (sx, sy) => `<path d="M${sx} ${sy} q5 8 0 11 q-5 -3 0 -11Z" fill="#BFDDF0" opacity=".9"/>`;
  let g = '';
  switch (mood) {
    case 'happy':     g = line('M-22 -3 q5 -6 10 0 M12 -3 q5 -6 10 0') + blush(.55) + line('M-5 10 q5 5 10 0'); break;
    case 'starry': {   // star eyes: for the ones that made it into the Hall of Fame
      const star = cx => `<path transform="translate(${cx} -5) scale(.95)" d="M0 -11 l3.6 7.6 l8.4 1.1 l-6.1 5.8 l1.6 8.3 l-7.5 -4.1 l-7.5 4.1 l1.6 -8.3 l-6.1 -5.8 l8.4 -1.1Z" fill="#FFD95A" stroke="${c}" stroke-width="2" stroke-linejoin="round"/><circle cx="${cx - 2.4}" cy="-9" r="1.7" fill="#fff"/>`;
      g = star(-18) + star(18) + blush(.65) + `<path d="M-7 8 q7 10 14 0Z" fill="${c}"/>`; break; }
    case 'delighted': g = line('M-22 -2 q5 -7 10 0 M12 -2 q5 -7 10 0') + blush(.7) + `<path d="M-7 8 q7 10 14 0Z" fill="${c}"/>`; break;
    case 'ok':        g = eyes() + blush(.35) + line('M-4 11 h8'); break;
    case 'worried':   g = line('M-22 -14 l8 -3 M22 -14 l-8 -3') + eyes() + blush(.4) + line('M-5 13 q5 -4 10 0') + drop(32, -22); break;
    case 'panicked':  g = `<circle cx="-17" cy="-4" r="4.6" fill="none" stroke="${c}" stroke-width="2"/><circle cx="17" cy="-4" r="4.6" fill="none" stroke="${c}" stroke-width="2"/>` + blush(.4)
                        + `<ellipse cx="0" cy="13" rx="3.6" ry="4.4" fill="${c}"/>` + drop(34, -24) + drop(-38, -16); break;
    case 'dead':      g = line('M-21 -8 l7 7 M-14 -8 l-7 7 M14 -8 l7 7 M21 -8 l-7 7') + blush(.35) + line('M-4 11 h8'); break;
    case 'cool':      g = `<rect x="-27" y="-9" width="18" height="8" rx="4" fill="${c}"/><rect x="9" y="-9" width="18" height="8" rx="4" fill="${c}"/>` + line('M-9 -6 h18') + blush(.4) + line('M-4 10 q5 4 10 -1'); break;
    case 'sad':       g = eyes(3.8) + blush(.35) + line('M-5 13 q5 -4 10 0'); break;
    default:          g = eyes() + blush(.4) + line('M-8 11 q2.7 -3 5.3 0 t5.3 0') + drop(32, -20);   // nervous
  }
  return `<g transform="translate(${x} ${y}) scale(${s * 1.2})">${g}</g>`;
}

const biteMask = (id, bites, grow, center, clearY) => {
  const shapes = bites.map(([x, y, r]) => {
    const a = Math.atan2(center[1] - y, center[0] - x);
    const teeth = [-.8, -.27, .27, .8].map(o => {
      const tx = x + Math.cos(a + o) * r * .92, ty = y + Math.sin(a + o) * r * .92;
      return `<circle cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="${(r * .3 + grow).toFixed(1)}"/>`;
    }).join('');
    return `<circle cx="${x}" cy="${y}" r="${r + grow}"/>${teeth}`;
  }).join('');
  return `<mask id="${id}" maskUnits="userSpaceOnUse" x="-60" y="-120" width="380" height="500"><rect x="-60" y="-120" width="380" height="500" fill="#fff"/><g fill="#000">${shapes}${clearY ? `<rect x="-60" y="-120" width="380" height="${clearY + 120}"/>` : ''}</g></mask>`;
};

function iceCream({ form = 'cone', flavor = 'vanilla', toppings = [], decor = [], bites = 0, mood = 'nervous', crown = false, face = true, falling = false, headroom = false, label = '' } = {}) {
  const art = FORM_ART[form] || FORM_ART.other;
  const f = flavor === 'blank' ? BLANK_FLAVOR : FLAVORS[flavor] || FLAVORS.other;
  const id = 'i' + (++svgId);
  const drawn = Math.min(bites, art.bites.length);
  const used = art.bites.slice(0, drawn);
  const melt = Math.min(1, bites / 8);
  let spot = art.faces[0];
  art.faces.forEach(fc => { if (drawn >= fc[0]) spot = fc; });

  const puddleW = 20 + melt * 84;
  const puddle = bites > 0 ? `<ellipse cx="${art.tip[0]}" cy="${art.tip[1] + 6}" rx="${puddleW}" ry="${5 + melt * 7}" fill="${f.base}"/>` : '';
  const droplet = falling ? `<path class="fall" d="M${art.tip[0]} ${art.tip[1] - 2} q6 9 0 13 q-6 -4 0 -13Z" fill="${f.base}"/>` : '';
  const crownSvg = crown ? `<g transform="translate(130 ${decor.length ? -24 : -8})"><path d="M-44 12 L-52 -32 L-22 -10 L0 -42 L22 -10 L52 -32 L44 12 Z" fill="#FFE98F"/><circle cy="-2" r="6" fill="#EE6B83"/></g>` : '';
  let clearY = 0;   // once an area is mostly eaten, sweep away any floating crumbs above this line
  (art.clear || []).forEach(c => { if (drawn >= c[0]) clearY = c[1]; });
  const masks = used.length ? biteMask(id + 'a', used, 0, art.center, clearY) : '';
  const m = suffix => used.length ? `mask="url(#${id}${suffix})"` : '';

  const tall = crown || headroom || decor.length > 0;
  // Decorations sit on top, so they're gone by the third bite.
  const deco = decor.length && drawn < 3 ? decorSVG(decor, art.top[0], art.top[1]) : { back: '', front: '' };

/* ==========================================================================
   GAME STATE
   "game" is the ice cream currently being eaten. It is saved after every bite,
   so closing the tab, or a phone going to sleep, doesn't lose it.
   ========================================================================== */
let game = loadCurrentGame();
let draft = null;     // what's on the workbench so far
let fresh = null;     // id of the record that just got its verdict (plays the big reveal once)
let freshGrave = null;// id of a tombstone to raise when the graveyard next opens
let homeTaps = 0;

function loadCurrentGame() {
  try { return JSON.parse(storeGet(CURRENT_KEY)); } catch (e) { return null; }
}
function saveCurrentGame() {
  if (game) storeSet(CURRENT_KEY, JSON.stringify(game)); else storeDelete(CURRENT_KEY);
}
function startDraft(changedMind = false) {
  draft = { form: null, flavor: null, toppings: [], decor: [], reason: null, name: '', place: '', placeOther: '', loc: '', changedMind };
}
function beginGame() {
  const name = draft.name.trim() || defaultName(draft.flavor, draft.form);
  const prediction = predictSurvival(draft.form, draft.flavor, allRecords(), draft.toppings);
  const place = draft.place === PLACE_OTHER_LABEL ? draft.placeOther.trim() : draft.place;
  game = {
    id: newId(),
    date: new Date().toISOString(),
    name, place, form: draft.form, flavor: draft.flavor, toppings: draft.toppings, decor: draft.decor, reason: draft.reason,
    loc: LOCATIONS[draft.loc] ? draft.loc : '', changedMind: !!draft.changedMind,
    prediction, stage: 'loading',
    bites: 0, firstReaction: null, laterReactions: [], asked: [], stopReason: null, lastSay: null,
    challenge: null, rest: null, mode: 'game', said: [],
    loadingLine: pick(COPY.loading),
  };
  draft = null;
  saveCurrentGame();
}
function checkpointFor(bite) {
  if (CHECKPOINT_AT[bite]) return CHECKPOINT_AT[bite];
  const r = CHECKPOINT_REPEAT;
  return bite > r.after && (bite - r.after) % r.every === 0 ? r.ask : null;
}
function lastScore(g) {
  const later = g.laterReactions[g.laterReactions.length - 1];
  return later ? later.score : g.firstReaction ? g.firstReaction.score : null;
}
// More bites = more distress, unless the latest reaction was very positive.
function moodFor(g) {
  const s = lastScore(g);
  if (g.bites === 0) return 'nervous';
  if (s === 5 && g.bites < 12) return 'delighted';
  if (s === 1) return 'panicked';
  if (g.bites >= 9) return 'panicked';
  if (s === 4 && g.bites < 6) return 'happy';
  if (s === 2 || g.bites >= 6) return 'worried';
  return g.bites >= 3 ? 'nervous' : 'ok';
}
function biteStatus(g) {
  const c = COPY.biteStatus, p = g.prediction.predictedBites;
  if (g.bites >= 25) return c.veryLong;
  if (g.bites > MAX_DRAWN_BITES + 1) return c.nothingLeft;
  if (g.lastSay && g.lastSayBite === g.bites) return g.lastSay;
  if (g.bites === 0) return c.start;
  if (g.bites === p) return c.atPrediction;
  if (g.bites >= p + 3) return c.farPast;
  if (g.bites > p) return c.pastPrediction;
  if (g.bites === 2) return c.friend;
  const left = p - g.bites;
  return `The machine gives it ${left} more bite${left === 1 ? '' : 's'}.`;
}
// Turns the game into a saved record. Used by the full game and by Quick Record,
// so both produce exactly one record, through the same rules.
function endGame(finished, rebuy) {
  const g = game;
  if (!g || findRecord(g.id)) { game = null; saveCurrentGame(); return; }   // a double tap can't save it twice
  const record = finaliseRecord({
    id: g.id, kind: 'bought', date: g.date, name: g.name, place: g.place, form: g.form,
    flavorCategory: g.flavor, toppings: g.toppings, decorations: g.decor, reasonForBuying: g.reason,
    predictedBites: g.prediction.predictedBites,
    predictionConfidence: g.prediction.confidence,
    predictionConfidenceScore: g.prediction.confidenceScore,
    finishOddsOneIn: g.prediction.finishOddsOneIn,
    actualBites: g.bites, finished,
    firstReaction: g.firstReaction, laterReactions: g.laterReactions,
    stopReason: finished ? null : g.stopReason, repurchase: rebuy,
    mode: g.mode || 'game',
    ...(!finished && g.rest ? { rest: g.rest } : {}),
    ...(g.loc ? { loc: g.loc } : {}),
    ...(g.changedMind ? { changedMind: true } : {}),
  });
  const advice = chooseAdvice(record);   // the machine's advice is decided once, here, and remembered
  if (advice) record.advice = advice;
  saveRecord(record);
  game = null;
  saveCurrentGame();
  fresh = record.id;
  if (!record.finished && inGraveyard(record)) freshGrave = record.id;
  go('result/' + record.id);
}

/* --- ARCHIVE: magnets on a freezer door -------------------------------------------- */
function learningNote(s) {
  if (s.earlyError === null) return 'Too early to say if it’s learning. It is, however, very sure of itself.';
  const diff = s.earlyError - s.lateError;
  if (diff > .75) return `It’s improving: off by ${s.earlyError.toFixed(1)} bites on average at first, ${s.lateError.toFixed(1)} lately. Do something about that.`;
  if (diff < -.75) return `It has more data than ever and is getting worse: ${s.earlyError.toFixed(1)} bites off at first, ${s.lateError.toFixed(1)} lately.`;
  return `All this data and it’s still off by about ${s.avgError.toFixed(1)} bites. Taste remains annoyingly personal.`;
}

/* --- Small effects ---------------------------------------------------------------------- */
function confetti(count = 70) {
  if (reducedMotion()) return;
  const colors = ['#F4C7D0', '#D8E6C8', '#D6D7EE', '#F4E3B0', '#EFD3B4', '#FFFFFF'];
  for (let i = 0; i < count; i++) {
    const s = document.createElement('i');
    s.className = 'sprinkle';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.background = pick(colors);
    s.style.setProperty('--t', (1.2 + Math.random() * 1.1) + 's');
    s.style.setProperty('--d', (Math.random() * .5) + 's');
    s.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
    s.style.setProperty('--rot', (Math.random() * 900 - 450) + 'deg');
    fxLayer.appendChild(s);
    setTimeout(() => s.remove(), 3000);
  }
}
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status');
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

/* ==========================================================================
   ROUTER: the part after # in the address decides the screen, which keeps the
   phone's back button working.
   ========================================================================== */
function go(route) {
  const target = '#' + route;
  if (location.hash === target) render(); else location.hash = target;
}
let loadingTimer = null;
function render() {
  closeOverlay();
  const [route, param, extra, more] = location.hash.replace('#', '').split('/');
  // The old “OH. YOU AGAIN?” step is gone: an old #tempt link just opens the workbench.
  if (route === 'tempt') { history.replaceState(null, '', '#create'); return render(); }
  // The Graveyard and the Hall of Fame now live in the freezer's Freshly Frozen drawer,
  // and a memory opens on the freezer's stage (except from the workbench).
  if (route === 'graveyard' || route === 'hall') { history.replaceState(null, '', '#freezer/fresh'); return render(); }
  if (route === 'archive') { history.replaceState(null, '', '#freezer/door'); return render(); }   // the archive lives on the freezer now
  if (route === 'memory' && extra !== 'bench') { history.replaceState(null, '', '#freezer/' + (param || '')); return render(); }
  // The cover and the workbench are one room now; so are eating and the verdict.
  if ((!route || route === 'home' || route === 'create') && game) { history.replaceState(null, '', '#play'); return render(); }
  // an ice cream with nothing picked yet isn't kept: home is just the room
  if ((!route || route === 'home') && draft && !draft.form && !draft.flavor && !draft.toppings.length && !draft.decor.length && !draft.name && !draft.place && !draft.reason && !draft.loc) draft = null;
  if ((!route || route === 'home') && draft) { history.replaceState(null, '', '#create'); return render(); }
  if (route === 'play' && !game) { history.replaceState(null, '', '#home'); return render(); }
  const prevMode = document.getElementById('roomScreen')?.dataset.mode;
  roomScrollKeep = document.getElementById('roomScroll')?.scrollLeft ?? null;
  document.body.dataset.screen = route || 'home';
  let html = null;
  if (['', 'home', 'create', 'play', 'result', 'about', 'resisted', 'nextscoop'].includes(route || '')) {
    if (route === 'create' && !draft) startDraft();
    const win = roomWindowFor(route, decodeURIComponent(param || ''));
    if (!(['result', 'resisted'].includes(route) && win === null)) {
      document.body.dataset.screen = 'room';
      app.innerHTML = screenRoom(win, route);
      window.scrollTo(0, 0);
      afterRender(route);
      afterRoom(prevMode);
      return;
    }
  }
  switch (route) {
    case 'about':     html = screenAbout(); break;
    case 'freezer':   html = screenFreezer(decodeURIComponent(param || ''), extra, more); break;
    case 'resisted':  html = screenResisted(decodeURIComponent(param || '')); break;
    case 'memory':    html = screenMemory(decodeURIComponent(param || ''), extra); break;
    case 'result':    html = screenResult(decodeURIComponent(param || '')); break;
    case 'create':    if (!draft) startDraft(); html = screenCreate(); break;
    case 'play':
      if (game) {
        html = ({ loading: screenLoading, predict: screenPredict, bite: screenBite, quit: screenQuit, rest: screenRest, rebuy: screenRebuy, finish: screenFinish, quick: screenQuick }[game.stage] || screenBite)();
      }
      break;
  }
  if (html === null) { history.replaceState(null, '', '#home'); return render(); }
  app.innerHTML = html;
  window.scrollTo(0, 0);
  afterRender(route);
}
function afterRender(route) {
  clearTimeout(loadingTimer);
  if (route === 'freezer') {
    const card = document.getElementById('memory');
    if (card) bindMemoryStage(false);   // it always comes out frozen, so the melt plays every time
    chestState(); history.replaceState(null, '', '#' + freezerHash());
    requestAnimationFrame(drawThreads); setTimeout(() => { fitFreezer(); }, 900);
    if (!wideFreezer() && fz.view !== 'none') requestAnimationFrame(() => document.getElementById('memStagePanel')?.scrollIntoView({ block: 'start' }));
  }
  if (route === 'memory') bindMemoryStage(false);   // from the workbench: starts frozen
  if (route === 'play' && game && game.stage === 'loading') {
    loadingTimer = setTimeout(() => { if (game && game.stage === 'loading') setStage('predict'); }, reducedMotion() ? 500 : 1150);
  }

  if (route === 'play' && game && game.stage === 'finish') confetti();
  if (route === 'result' && fresh) {
    const r = findRecord(fresh);
    if (r && verdictOf(r).id === 'approved') { confetti(150); setTimeout(() => confetti(120), 700); }
    else if (r && r.finished) confetti(70);
    fresh = null;
  }
  const nameInput = document.getElementById('fName');
  if (nameInput) {
    nameInput.addEventListener('input', () => { draft.name = nameInput.value; });
    const placeInput = document.getElementById('fPlace');
    placeInput.addEventListener('input', () => { draft.placeOther = placeInput.value; updatePlaceMemory(); });
    updatePlaceMemory();
  }
}
function setStage(stage) { game.stage = stage; saveCurrentGame(); render(); }

/* ==========================================================================
   ACTIONS: what each button does. Buttons name their action with data-act.
   ========================================================================== */
const ACTIONS = {
  setLang(v) { if ((v === 'zh' || v === 'en') && v !== LANG) setLanguage(v); },
  // Memory Freezer
  openMemory(v, el) {
    if (el && el.dataset.from === 'bench') { go('memory/' + v + '/bench'); return; }
    if (document.getElementById('memStagePanel')) { if (overlay.classList.contains('open')) closeOverlay(); ACTIONS.pickMemory(v); return; }
    go('freezer/' + v);
  },
  // taking one out of the chest: it shows on the stage, no new page
  pickMemory(v) {
    if (!memoryById(v)) return;
    const s = fz.view === 'story' && MEMORY_SERIES[fz.story];
    if (s && s.ids.includes(v)) fz = { ...fz, step: s.ids.indexOf(v), sel: v };
    else { const wasStories = fz.mode === 'stories'; fz = { ...fz, mode: 'all', view: 'memory', sel: v }; if (wasStories) refreshFreezerBar(); }
    renderStage(true);
  },
  freezerMode(v) {
    fz = v === 'stories' ? { ...fz, mode: 'stories', view: 'stories', story: null, sel: null } : { ...fz, mode: 'all', view: fz.sel && fz.view === 'story' ? 'memory' : 'none', story: null };
    refreshFreezerBar(); renderStage(false);
  },
  freezerFilter(v) {
    fz = { ...fz, filter: KIND_FILTERS[v] ? v : 'all' };
    refreshFreezerBar(); chestState();
  },
  openStory(v) {
    const s = MEMORY_SERIES[v]; if (!s || !s.story) return;
    fz = { ...fz, mode: 'stories', view: 'story', story: v, step: 0, sel: s.ids[0] };
    refreshFreezerBar(); renderStage(true);
  },
  storyStep(v) {
    const s = MEMORY_SERIES[fz.story]; if (!s) return;
    fz.step = Math.max(0, Math.min(s.ids.length - 1, fz.step + Number(v))); fz.sel = s.ids[fz.step];
    renderStage(false);
  },
  // the note on the front of the chest: the archive, on the stage
  openDoor() {
    if (!document.getElementById('memStagePanel')) { go('freezer/door'); return; }
    const wasStories = fz.mode === 'stories';
    fz = { ...fz, mode: 'all', view: 'door', story: null };
    if (wasStories) refreshFreezerBar();
    renderStage(true);
  },
  // put it back: the chest has the screen to itself again
  closeStage() {
    const wasStories = fz.mode === 'stories';
    fz = { ...fz, mode: 'all', view: 'none', story: null, sel: null };
    if (wasStories) refreshFreezerBar();
    renderStage(false);
    if (!wideFreezer()) ACTIONS.stageUp();
  },
  stageUp() { document.getElementById('chestScroll')?.scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth', block: 'center' }); },
  memSkip() { memState && memState.skip(); },
  memAgain() { memState && memState.again(); },
  memBackBench() { go('create'); },
  home() { go('home'); },
  start() { startDraft(); go('create'); },
  resume() { go('play'); },
  forfeit() { confirmSheet('FORGET THIS ONE?', `${game.name} won’t be recorded.`, 'YES, FORGET IT', 'forfeitYes'); },
  forfeitYes() { game = null; saveCurrentGame(); closeOverlay(); startDraft(); go('create'); },
  rerollMini(_, el) {
    const bob = el.querySelector('.bob');
    bob.innerHTML = iceCream(randomLook());
    el.classList.remove('squash'); void el.offsetWidth; el.classList.add('squash');
  },
  pokeHome() {
    const el = document.getElementById('homeChar'), bubble = document.getElementById('homeBubble');
    homeTaps++;
    el.classList.remove('squash', 'wobble'); void el.offsetWidth; el.classList.add('squash');
    setTimeout(() => { el.classList.remove('squash'); el.classList.add('wobble'); }, 300);
    if (homeTaps === 10) {   // easter egg: poke it ten times
      el.innerHTML = iceCream({ ...heroLook, bites: 12, mood: 'dead', label: 'A melted ice cream' });
      bubble.textContent = COPY.home.meltEgg;
      setTimeout(() => { homeTaps = 0; if (document.getElementById('homeChar')) render(); }, 2600);
    } else if (homeTaps < 10) {
      let line; do { line = pick(COPY.home.quips); } while (line === bubble.textContent);
      bubble.textContent = line;
      bubble.classList.remove('pop'); void bubble.offsetWidth; bubble.classList.add('pop');
    }
  },

  // The workbench
  pickForm(v)   { ensureMaking(); draft.form = v; refreshBench(FORM_SAYS[v], true); },
  pickFlavor(v) { ensureMaking(); draft.flavor = v; refreshBench(FLAVOR_SAYS[v], true); },
  pickTopping(v) {
    ensureMaking();
    const on = draft.toppings.includes(v);
    draft.toppings = on ? draft.toppings.filter(x => x !== v) : [...draft.toppings, v];
    refreshBench(on ? 'Fine. Take it off.' : TOPPINGS[v].say, !on);
  },
  pickDecor(v) {
    ensureMaking();
    const on = draft.decor.includes(v);
    draft.decor = on ? draft.decor.filter(x => x !== v) : [...draft.decor, v];
    refreshBench(on ? 'Fine. Take it off.' : DECORATIONS[v].say, !on);
  },
  // Random ice cream: changes shape, flavor, toppings and decorations.
  // The name, place and reason are left alone.
  randomize(_, el) {
    ensureMaking();
    el = document.getElementById('diceBtn') || el;
    const another = (list, current) => pick(list.filter(x => x !== current));
    const some = (list, max) => [...list].sort(() => Math.random() - .5).slice(0, Math.floor(Math.random() * (max + 1)));
    draft.form = another(Object.keys(FORMS), draft.form);
    draft.flavor = another(Object.keys(FLAVORS), draft.flavor);
    draft.toppings = some(Object.keys(TOPPINGS), 3);
    draft.decor = some(Object.keys(DECORATIONS), 2);
    refreshBench(pick(COPY.bench.randomSays), true);
    el.classList.remove('rolling'); void el.offsetWidth; el.classList.add('rolling');
    // bring what was picked into view in each tray
    document.querySelectorAll('.bins').forEach(bins => {
      const on = bins.querySelector('.bin.on');
      bins.scrollLeft = on ? bins.scrollLeft + on.getBoundingClientRect().left - bins.getBoundingClientRect().left - 12 : 0;
    });
  },
  pickReason(v) { draft.reason = draft.reason === v ? null : v; refreshBench(); },
  pickPlace(v) {
    draft.place = draft.place === v ? '' : v;
    refreshBench();
    updatePlaceMemory();
    const other = document.getElementById('fPlace');
    if (!other) return;
    other.hidden = draft.place !== PLACE_OTHER_LABEL;
    if (!other.hidden) other.focus();
  },
  enterArena() {
    if (!draft.form) return nudgeTray('trayForm', COPY.bench.needShape);
    if (!draft.flavor) return nudgeTray('trayFlavor', COPY.bench.needFlavor);
    beginGame(); go('play');
  },

  // Prediction
  toggleReceipt(_, el) {
    const r = document.getElementById('receipt');
    r.hidden = !r.hidden;
    el.setAttribute('aria-expanded', String(!r.hidden));
    el.textContent = r.hidden ? 'See the machine’s working' : 'Hide the machine’s working';
    if (!r.hidden) r.scrollIntoView({ block: 'start', behavior: reducedMotion() ? 'auto' : 'smooth' });
  },
  toggleDetails(v, el) {
    const d = document.getElementById('vdetails'); if (!d) return;
    d.hidden = !d.hidden; el.setAttribute('aria-expanded', String(!d.hidden));
    el.textContent = d.hidden ? 'MORE DETAILS' : 'FEWER DETAILS';
    if (!d.hidden) d.scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth', block: 'start' });
  },
  startEating() { if (!game) return; delete game.challenge; setStage('bite'); },   // no bets any more: just eat

  // The bite game
  bite() {
    if (overlay.classList.contains('open')) return;
    game.bites++;
    game.lastSay = null;
    const line = biteMachineLine(game);
    if (line) game.said.push(line);
    saveCurrentGame();
    updateBiteScreen(true);
    if (line) showMachineSay(BITE_LINES[line]);
    try { navigator.vibrate && navigator.vibrate(15); } catch (e) {}
    // no window between bites any more: after the first one, the little faces nudge once
    if (game.bites === 1 && !game.firstReaction) document.querySelector('.rm-react.bite')?.classList.add('hint');
  },
  undoBite() {
    if (game.bites > 0) { game.bites--; saveCurrentGame(); updateBiteScreen(false); }
  },
  react(v, el) {
    if (Date.now() - checkpointOpenedAt < 250) return;   // that tap was meant for the ice cream
    const id = el.dataset.cp, opt = CHECKPOINTS[id].options[+v];
    const entry = { checkpoint: id, label: opt.label, score: opt.score };
    if (id === 'first' && !game.firstReaction) game.firstReaction = entry;
    else game.laterReactions.push({ bite: game.bites, ...entry });
    game.asked.push(game.bites);
    game.lastSay = opt.say; game.lastSayBite = game.bites;
    saveCurrentGame();
    closeOverlay();
    updateBiteScreen(false);
  },
  skipReact() { game.asked.push(game.bites); saveCurrentGame(); closeOverlay(); },
  done() { setStage('quit'); },
  finished() { setStage('finish'); },
  backToBite() { setStage('bite'); },
  pickKiller(v) { if (!game) return; game.stopReason = v; setStage('rebuy'); },
  rebuy(v) { endGame(false, v || null); },
  finishRebuy(v) { endGame(true, v || null); },

  // Cards and settings
  open(v) { openCard(v); },
  closeSheet() { closeOverlay(); },
  eraseOne(v) { confirmSheet('ERASE THIS RECORD?', 'It will be gone from the archive and the machine’s memory.', 'YES, ERASE IT', 'eraseOneYes', v); },
  eraseOneYes(v) { deleteEntry(v); render(); },
  askReset() {
    confirmSheet('DELETE EVERYTHING?', SHARED_ARCHIVE_URL
      ? 'Every ice cream, every grave and everything the machine has learned, for everyone who opens this site.'
      : 'Every ice cream, every grave and everything the machine has learned. This can’t be undone.', 'YES, DELETE ALL OF IT', 'resetYes');
  },
  resetYes() { storeDelete(STORAGE_KEY); storeDelete(CURRENT_KEY); storeDelete(KEPT_KEY); storeDelete(ACH_SEEN_KEY); game = null; queueShared({ action: 'reset' }); closeOverlay(); render(); toast('The machine remembers nothing.'); },
  copyData() {
    const kept = keptLocal();   // memories kept only on this device go into the backup too
    const text = JSON.stringify(loadRealRecords().map(r => kept[r.id] ? { ...r, keptOnThisDevice: kept[r.id] } : r), null, 2);
    const done = () => toast('Copied. Paste it somewhere safe.');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
    else fallbackCopy(text, done);
  },
};
Object.assign(ACTIONS, EXTRA_ACTIONS);
Object.assign(ACTIONS, ROOM_ACTIONS);
function fallbackCopy(text, done) {
  const t = document.createElement('textarea');
  t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
  document.body.appendChild(t); t.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast('Copying isn’t available in this browser.'); }
  t.remove();
}

document.addEventListener('click', e => {
  const goEl = e.target.closest('[data-go]');
  if (goEl) { go(goEl.dataset.go); return; }
  const el = e.target.closest('[data-act]');
  if (el && ACTIONS[el.dataset.act]) { ACTIONS[el.dataset.act](el.dataset.val, el); return; }
  // Tapping the dim area closes record cards, never a checkpoint.
  if (e.target === overlay && !overlay.querySelector('[data-act=react]')) closeOverlay();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && overlay.classList.contains('open') && !overlay.querySelector('[data-act=react]')) closeOverlay();
  else if (e.key === 'Escape' && !overlay.classList.contains('open') && document.getElementById('memStagePanel') && fz.view !== 'none') ACTIONS.closeStage();
});
// Drop-downs name their action with data-change.
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]');
  if (el && ACTIONS[el.dataset.change]) ACTIONS[el.dataset.change](el.value, el);
});
window.addEventListener('hashchange', render);
window.addEventListener('resize', () => {
  if (!location.hash.startsWith('#freezer')) return;
  const inside = document.getElementById('fridgeInside');
  if (inside && inside.dataset.wide !== (wideFreezer() ? '1' : '0')) { render(); return; }   // crossed between phone and computer layouts
  fitFreezer(); drawThreads();
});
seedAchievements();
startLanguage();
render();
// Shared archive: fetch on open, again when the phone comes back online or the tab is reopened.
if (SHARED_ARCHIVE_URL) {
  pullShared();
  window.addEventListener('online', pullShared);
  // Opening a gallery checks for new records, at most every few seconds.
  let lastPull = Date.now();
  window.addEventListener('hashchange', () => {
    const route = location.hash.replace('#', '').split('/')[0];
    if (['graveyard', 'hall', 'archive', 'about', 'freezer'].includes(route) && Date.now() - lastPull > 3000) { lastPull = Date.now(); pullShared(); }
  });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pullShared(); });
}
</script>
